<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>هێزی شۆفێر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Noto Sans Arabic",Arial,sans-serif;
    background:#02040a;
    color:#fff;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

/* =========================
   کەڤەری سەرەتا
   ========================= */

#landing{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#000;
    z-index:1;
}

.cover-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
}

.cover-start{
    position:absolute;
    z-index:10;
    left:50%;
    bottom:4%;
    transform:translateX(-50%);
    width:min(430px,82vw);
    height:85px;
    border:0;
    border-radius:60px;
    background:transparent;
    cursor:pointer;
}

/* هیچ animation نییە */
*{
    animation:none !important;
}

/* =========================
   LOGIN
   ========================= */

#loginModal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(12px);
}

#loginModal.show{
    display:flex;
}

.login-box{
    width:min(450px,95vw);
    padding:30px;
    border-radius:25px;
    background:linear-gradient(145deg,#101a2c,#05080e);
    border:1px solid #00d9ff55;
    box-shadow:0 0 60px #00cfff25;
}

.login-box h1{
    text-align:center;
    color:#00eaff;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#9da9ba;
    margin-bottom:20px;
}

.input{
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border-radius:14px;
    border:1px solid #ffffff25;
    background:#ffffff0a;
    color:#fff;
    outline:none;
    font-size:16px;
}

.input:focus{
    border-color:#00eaff;
}

.btn{
    width:100%;
    padding:15px;
    border-radius:15px;
    border:0;
    cursor:pointer;
    font-size:16px;
    font-weight:900;
}

.btn-primary{
    color:#001018;
    background:linear-gradient(135deg,#00eaff,#287cff);
}

.btn-secondary{
    color:#fff;
    background:#ffffff0b;
    border:1px solid #ffffff20;
    margin-top:10px;
}

/* =========================
   QUIZ
   ========================= */

#quiz{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    background:#03060c;
}

.quiz-container{
    width:min(900px,100%);
    margin:auto;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}

.logo{
    font-size:22px;
    font-weight:900;
    color:#00eaff;
}

.stats{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.stat{
    padding:7px 12px;
    border-radius:12px;
    background:#ffffff09;
    border:1px solid #ffffff14;
}

.progress{
    width:100%;
    height:7px;
    border-radius:20px;
    background:#ffffff12;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00eaff,#247cff);
}

.timer{
    text-align:center;
    color:#00eaff;
    font-size:20px;
    font-weight:900;
    margin-bottom:15px;
}

.question-box{
    padding:25px;
    border-radius:25px;
    background:linear-gradient(145deg,#111a29,#06090f);
    border:1px solid #ffffff12;
}

.question-number{
    color:#8e9aab;
    margin-bottom:8px;
}

.question{
    font-size:23px;
    line-height:1.8;
    margin-bottom:20px;
}

.option{
    display:block;
    width:100%;
    text-align:right;
    padding:15px;
    margin:9px 0;
    border-radius:15px;
    border:1px solid #ffffff16;
    background:#ffffff08;
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

.option.selected{
    border-color:#00eaff;
    background:#00eaff15;
}

.next-btn{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#00eaff,#247cff);
    color:#001018;
    font-weight:900;
    cursor:pointer;
}

.next-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================
   RESULT
   ========================= */

#result{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    background:#03060c;
}

.result-box{
    width:min(900px,100%);
    margin:auto;
    padding:30px;
    border-radius:25px;
    background:linear-gradient(145deg,#111a29,#06090f);
    border:1px solid #ffffff12;
    text-align:center;
}

.score{
    font-size:60px;
    color:#00eaff;
    font-weight:900;
    margin:20px 0;
}

/* =========================
   LEADERBOARD
   ========================= */

#leaderboard{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    background:#03060c;
}

.leaderboard-box{
    width:min(800px,100%);
    margin:auto;
    padding:25px;
    border-radius:25px;
    background:linear-gradient(145deg,#111a29,#06090f);
}

.leaderboard-box h1{
    text-align:center;
    color:#00eaff;
    margin-bottom:20px;
}

.lb-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    margin:8px 0;
    border-radius:14px;
    background:#ffffff08;
}

.lb-name{
    flex:1;
}

.lb-score{
    color:#00eaff;
    font-weight:900;
}

/* =========================
   HOST
   ========================= */

#hostBox{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    background:#03060c;
}

.host-container{
    width:min(900px,100%);
    margin:auto;
}

.host-card{
    padding:25px;
    border-radius:25px;
    background:linear-gradient(145deg,#111a29,#06090f);
    border:1px solid #ffffff12;
}

.host-card h1{
    text-align:center;
    color:#00eaff;
    margin-bottom:20px;
}

.host-result{
    padding:15px;
    margin:8px 0;
    border-radius:14px;
    background:#ffffff08;
    line-height:2;
}

.host-button{
    position:fixed;
    left:10px;
    bottom:10px;
    border:0;
    background:transparent;
    color:#ffffff33;
    cursor:pointer;
}

/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

    .cover-start{
        width:85vw;
        height:75px;
        bottom:3%;
    }

    .question{
        font-size:19px;
    }

    .topbar{
        flex-direction:column;
        align-items:stretch;
    }

    .stats{
        justify-content:center;
    }

    .login-box{
        padding:22px;
    }
}
</style>
</head>

<body>

<!-- =========================
     START COVER
     ========================= -->

<section id="landing">

    <img
        src="68291.png"
        class="cover-image"
        alt="هێزی شۆفێر"
    >

    <!-- ئەم دوگمەیە لەسەر دوگمەی وێنەکەیە -->
    <button
        class="cover-start"
        onclick="openLogin()"
        aria-label="دەستپێکردنی چالاکی">
    </button>

</section>


<!-- =========================
     LOGIN
     ========================= -->

<div id="loginModal">

    <div class="login-box">

        <h1>🚘 چوونەژوورەوە</h1>

        <p>
            زانیارییەکانت بنووسە بۆ دەستپێکردنی چالاکی
        </p>

        <input
            id="playerName"
            class="input"
            type="text"
            placeholder="👤 ناوت بنووسە"
        >

        <input
            id="playerPhone"
            class="input"
            type="tel"
            placeholder="📱 ژمارەی مۆبایل"
        >

        <button
            class="btn btn-primary"
            onclick="login()">
            🚘 دەستپێکردنی چالاکی
        </button>

        <button
            class="btn btn-secondary"
            onclick="closeLogin()">
            داخستن
        </button>

    </div>

</div>


<!-- =========================
     QUIZ
     ========================= -->

<section id="quiz">

    <div class="quiz-container">

        <div class="topbar">

            <div class="logo">
                🚘 هێزی شۆفێر
            </div>

            <div class="stats">

                <div class="stat">
                    ⭐ <span id="xp">0</span>
                </div>

                <div class="stat">
                    🔥 <span id="combo">0</span>
                </div>

                <div class="stat">
                    ❤️ <span id="lives">3</span>
                </div>

            </div>

        </div>

        <div class="progress">
            <div
                id="progressBar"
                class="progress-bar">
            </div>
        </div>

        <div
            id="timer"
            class="timer">
            ⏱️ 40
        </div>

        <div class="question-box">

            <div
                id="questionNumber"
                class="question-number">
            </div>

            <div
                id="questionText"
                class="question">
            </div>

            <button
                id="option1"
                class="option"
                onclick="chooseAnswer(1)">
            </button>

            <button
                id="option2"
                class="option"
                onclick="chooseAnswer(2)">
            </button>

            <button
                id="option3"
                class="option"
                onclick="chooseAnswer(3)">
            </button>

            <button
                id="nextButton"
                class="next-btn"
                onclick="nextQuestion()"
                disabled>
                پرسیاری دواتر ←
            </button>

        </div>

    </div>

</section>


<!-- =========================
     RESULT
     ========================= -->

<section id="result">

    <div class="result-box">

        <h1>🏁 کۆتایی چالاکی</h1>

        <div
            id="finalScore"
            class="score">
            0%
        </div>

        <div id="finalText"></div>

        <button
            class="btn btn-primary"
            style="margin-top:20px"
            onclick="showLeaderboard()">
            🏆 Leaderboard
        </button>

        <button
            class="btn btn-secondary"
            onclick="location.reload()">
            🔄 دووبارە یاری کردن
        </button>

    </div>

</section>


<!-- =========================
     LEADERBOARD
     ========================= -->

<section id="leaderboard">

    <div class="leaderboard-box">

        <h1>🏆 Leaderboard</h1>

        <div id="leaderboardList"></div>

        <button
            class="btn btn-primary"
            onclick="backToQuiz()">
            ↩️ گەڕانەوە
        </button>

    </div>

</section>


<!-- =========================
     HOST
     ========================= -->

<section id="hostBox">

    <div class="host-container">

        <div
            id="hostLoginBox"
            class="host-card">

            <h1>👑 Host</h1>

            <input
                id="hostEmail"
                class="input"
                type="email"
                placeholder="Email">

            <input
                id="hostPassword"
                class="input"
                type="password"
                placeholder="Password">

            <button
                class="btn btn-primary"
                onclick="hostLogin()">
                چوونەژوورەوە
            </button>

        </div>


        <div
            id="hostDataBox"
            class="host-card"
            style="display:none">

            <h1>👑 ئەنجامەکان</h1>

            <div id="hostResults"></div>

            <button
                class="btn btn-secondary"
                onclick="hostLogout()">
                چوونەدەرەوە
            </button>

        </div>

    </div>

</section>


<button
    class="host-button"
    onclick="showHost()">
    👑
</button>


<script>

/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
"https://hqfvkkigcjehttciirfe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e1cjH9G8H8NLaA2t-h0_Pg_azgple4f";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   VARIABLES
   ========================= */

let questions = [];
let currentQuestion = 0;
let selectedAnswer = 0;
let correctAnswers = 0;
let xp = 0;
let combo = 0;
let maxCombo = 0;
let lives = 3;

let playerName = "";
let playerPhone = "";

let timer = null;
let timeLeft = 40;


/* =========================
   LOGIN
   ========================= */

function openLogin(){

    document
        .getElementById("loginModal")
        .classList.add("show");

}

function closeLogin(){

    document
        .getElementById("loginModal")
        .classList.remove("show");

}


async function login(){

    playerName =
        document
        .getElementById("playerName")
        .value
        .trim();

    playerPhone =
        document
        .getElementById("playerPhone")
        .value
        .trim();

    if(!playerName){

        alert("تکایە ناوت بنووسە");
        return;

    }

    if(!playerPhone){

        alert("تکایە ژمارەی مۆبایل بنووسە");
        return;

    }

    closeLogin();

    document
        .getElementById("landing")
        .style.display="none";

    await startQuiz();

}


/* =========================
   START QUIZ
   ========================= */

async function startQuiz(){

    const {data,error} =
        await supabaseClient
        .from("questions")
        .select("*");

    if(error){

        alert(
            "کێشە لە هێنانی پرسیارەکان:\n"
            + error.message
        );

        document
            .getElementById("landing")
            .style.display="block";

        return;

    }

    if(!data || !data.length){

        alert("هیچ پرسیارێک نییە");

        document
            .getElementById("landing")
            .style.display="block";

        return;

    }

    questions =
        data.sort(
            ()=>Math.random()-0.5
        );

    currentQuestion=0;
    correctAnswers=0;
    xp=0;
    combo=0;
    maxCombo=0;
    lives=3;

    document
        .getElementById("quiz")
        .style.display="block";

    showQuestion();

}


/* =========================
   SHOW QUESTION
   ========================= */

function showQuestion(){

    clearInterval(timer);

    selectedAnswer=0;

    const q =
        questions[currentQuestion];

    document
        .getElementById("questionNumber")
        .innerText =
        `پرسیاری ${currentQuestion+1} لە ${questions.length}`;

    document
        .getElementById("questionText")
        .innerText =
        q.question || "";

    document
        .getElementById("option1")
        .innerText =
        "1 ـ " + (q.option1 || "");

    document
        .getElementById("option2")
        .innerText =
        "2 ـ " + (q.option2 || "");

    document
        .getElementById("option3")
        .innerText =
        "3 ـ " + (q.option3 || "");

    for(let i=1;i<=3;i++){

        document
            .getElementById("option"+i)
            .classList.remove("selected");

    }

    document
        .getElementById("nextButton")
        .disabled=true;

    const progress =
        (currentQuestion /
        questions.length)*100;

    document
        .getElementById("progressBar")
        .style.width =
        progress+"%";

    startTimer();

}


/* =========================
   TIMER
   ========================= */

function startTimer(){

    timeLeft=40;

    updateTimer();

    timer =
        setInterval(()=>{

            timeLeft--;

            updateTimer();

            if(timeLeft<=0){

                clearInterval(timer);

                nextQuestion();

            }

        },1000);

}


function updateTimer(){

    document
        .getElementById("timer")
        .innerText =
        "⏱️ "+timeLeft+" چرکە";

}


/* =========================
   ANSWER
   ========================= */

function chooseAnswer(answer){

    selectedAnswer=answer;

    for(let i=1;i<=3;i++){

        document
            .getElementById("option"+i)
            .classList.remove("selected");

    }

    document
        .getElementById("option"+answer)
        .classList.add("selected");

    document
        .getElementById("nextButton")
        .disabled=false;

}


/* =========================
   NEXT QUESTION
   ========================= */

function nextQuestion(){

    clearInterval(timer);

    const q =
        questions[currentQuestion];

    const correct =
        Number(q.answer);

    if(selectedAnswer===correct){

        correctAnswers++;

        combo++;

        if(combo>maxCombo){
            maxCombo=combo;
        }

        xp += 10 + Math.min(combo*2,20);

    }else{

        combo=0;
        lives--;

    }

    updateStats();

    currentQuestion++;

    if(
        currentQuestion >=
        questions.length
    ){

        finishQuiz();
        return;

    }

    showQuestion();

}


/* =========================
   STATS
   ========================= */

function updateStats(){

    document
        .getElementById("xp")
        .innerText=xp;

    document
        .getElementById("combo")
        .innerText=combo;

    document
        .getElementById("lives")
        .innerText=lives;

}


/* =========================
   FINISH
   ========================= */

async function finishQuiz(){

    clearInterval(timer);

    document
        .getElementById("quiz")
        .style.display="none";

    document
        .getElementById("result")
        .style.display="block";

    const total =
        questions.length;

    const percentage =
        Math.round(
            correctAnswers /
            total * 100
        );

    document
        .getElementById("finalScore")
        .innerText =
        percentage+"%";

    document
        .getElementById("finalText")
        .innerHTML = `
            <p>👤 ${escapeHTML(playerName)}</p>
            <p style="margin-top:10px">
                ڕاست: ${correctAnswers}
                لە ${total}
            </p>
            <p style="margin-top:10px">
                ⭐ XP: ${xp}
            </p>
            <p style="margin-top:10px">
                🔥 Max Combo: ${maxCombo}
            </p>
        `;


    /* Leaderboard */

    const {data,error} =
        await supabaseClient
        .from("leaderboard")
        .insert({
            name:playerName,
            score:correctAnswers,
            total:total
        })
        .select()
        .single();


    /* Private result */

    if(!error && data){

        await supabaseClient
        .from("private_results")
        .insert({
            leaderboard_id:data.id,
            phone:playerPhone
        });

    }

}


/* =========================
   LEADERBOARD
   ========================= */

async function showLeaderboard(){

    document
        .getElementById("result")
        .style.display="none";

    document
        .getElementById("leaderboard")
        .style.display="block";

    const list =
        document
        .getElementById("leaderboardList");

    list.innerHTML="جارێک چاوەڕێ بکە...";

    const {data,error} =
        await supabaseClient
        .from("leaderboard")
        .select("name,score,total,created_at")
        .order(
            "score",
            {ascending:false}
        );

    if(error){

        list.innerHTML =
            "کێشەیەک ڕوویدا";

        return;

    }

    if(!data || !data.length){

        list.innerHTML =
            "هیچ ئەنجامێک نییە";

        return;

    }

    list.innerHTML =
        data.map((item,index)=>`

            <div class="lb-row">

                <b>
                    ${
                        index===0
                        ? "🥇"
                        : index===1
                        ? "🥈"
                        : index===2
                        ? "🥉"
                        : "#"+(index+1)
                    }
                </b>

                <div class="lb-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="lb-score">
                    ${item.score}/${item.total}
                </div>

            </div>

        `).join("");

}


function backToQuiz(){

    document
        .getElementById("leaderboard")
        .style.display="none";

    document
        .getElementById("result")
        .style.display="block";

}


/* =========================
   HOST
   ========================= */

function showHost(){

    document
        .getElementById("landing")
        .style.display="none";

    document
        .getElementById("quiz")
        .style.display="none";

    document
        .getElementById("result")
        .style.display="none";

    document
        .getElementById("leaderboard")
        .style.display="none";

    document
        .getElementById("hostBox")
        .style.display="block";

}


async function hostLogin(){

    const email =
        document
        .getElementById("hostEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("hostPassword")
        .value;

    if(!email || !password){

        alert("Email و Password بنووسە");
        return;

    }

    const {data,error} =
        await supabaseClient.auth
        .signInWithPassword({
            email,
            password
        });

    if(error){

        alert(
            "چوونەژوورەوە سەرکەوتوو نەبوو"
        );

        return;

    }

    const host =
        await supabaseClient
        .from("hosts")
        .select("*")
        .eq("user_id",data.user.id)
        .maybeSingle();

    if(!host.data){

        await supabaseClient.auth.signOut();

        alert(
            "ئەم ئەکاونتە Host نییە"
        );

        return;

    }

    document
        .getElementById("hostLoginBox")
        .style.display="none";

    document
        .getElementById("hostDataBox")
        .style.display="block";

    loadHostResults();

}


async function loadHostResults(){

    const box =
        document
        .getElementById("hostResults");

    box.innerHTML =
        "جارێک چاوەڕێ بکە...";

    const {data,error} =
        await supabaseClient
        .from("private_results")
        .select(`
            phone,
            created_at,
            leaderboard(
                name,
                score,
                total
            )
        `)
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        box.innerHTML =
            "کێشە لە هێنانی ئەنجامەکان";

        return;

    }

    if(!data || !data.length){

        box.innerHTML =
            "هیچ ئەنجامێک نییە";

        return;

    }

    box.innerHTML =
        data.map((item,index)=>`

            <div class="host-result">

                <b>#${index+1}</b>

                <br>

                👤
                ${escapeHTML(
                    item.leaderboard?.name || ""
                )}

                <br>

                📱
                ${escapeHTML(
                    item.phone || ""
                )}

                <br>

                🏆
                ${
                    item.leaderboard?.score || 0
                } /
                ${
                    item.leaderboard?.total || 0
                }

            </div>

        `).join("");

}


async function hostLogout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =========================
   SECURITY
   ========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
