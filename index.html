<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هێزی شۆفێر 🚦</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(circle at top,#243b55,#141e30 55%,#090d14);
    color:#fff;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

/* ================= COVER ================= */

.cover{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    position:relative;
    overflow:hidden;
}

.cover:before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    background:#00d4ff;
    filter:blur(150px);
    opacity:.18;
    top:-180px;
    right:-150px;
}

.cover:after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#ffb300;
    filter:blur(150px);
    opacity:.12;
    bottom:-180px;
    left:-120px;
}

.cover-card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:650px;
    text-align:center;
    padding:45px 30px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    width:110px;
    height:110px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    background:linear-gradient(135deg,#ffd54f,#ff8f00);
    box-shadow:0 0 40px rgba(255,183,0,.35);
}

.cover h1{
    font-size:42px;
    margin:25px 0 10px;
}

.cover p{
    color:#d5dbe5;
    font-size:19px;
    line-height:1.8;
}

.start-btn{
    border:0;
    padding:17px 50px;
    margin-top:25px;
    border-radius:50px;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    color:#111;
    background:linear-gradient(135deg,#ffd54f,#ff9800);
    box-shadow:0 10px 35px rgba(255,152,0,.25);
    transition:.2s;
}

.start-btn:hover{
    transform:translateY(-3px) scale(1.02);
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:100;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-card{
    width:100%;
    max-width:430px;
    background:#151c27;
    border:1px solid rgba(255,255,255,.12);
    border-radius:25px;
    padding:30px;
    box-shadow:0 30px 100px rgba(0,0,0,.6);
    text-align:center;
}

.modal-card h2{
    font-size:28px;
    margin-top:0;
}

.input{
    width:100%;
    padding:15px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #394454;
    background:#0e141d;
    color:white;
    font-size:18px;
    outline:none;
    text-align:center;
}

.input:focus{
    border-color:#00d4ff;
}

.modal-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    margin-top:10px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

.enter-btn{
    background:linear-gradient(135deg,#00d4ff,#0077ff);
    color:white;
}

.close-btn{
    background:#303846;
    color:white;
}

/* ================= MAIN ================= */

.page{
    display:none;
    width:100%;
    max-width:850px;
    margin:auto;
    padding:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.brand{
    font-size:22px;
    font-weight:bold;
}

.badge{
    padding:8px 14px;
    border-radius:20px;
    background:rgba(255,255,255,.09);
    color:#ddd;
}

/* ================= QUIZ ================= */

.progress-wrap{
    height:8px;
    background:#252e3b;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00d4ff,#ffd54f);
    transition:.3s;
}

.timer{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    padding:13px;
    border-radius:15px;
    background:rgba(255,255,255,.08);
    margin-bottom:15px;
}

.question-card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.question-number{
    color:#9ea8b8;
    margin-bottom:10px;
}

#questionText{
    font-size:26px;
    line-height:1.7;
    margin-top:10px;
}

.option{
    width:100%;
    padding:17px;
    margin:9px 0;
    border:1px solid #394454;
    border-radius:14px;
    background:#121923;
    color:#fff;
    cursor:pointer;
    font-size:19px;
    text-align:right;
    transition:.2s;
}

.option:hover{
    background:#1c2735;
    transform:translateX(-2px);
}

.option.selected{
    background:#16445a;
    border-color:#00d4ff;
}

.option.correct{
    background:#145c3a;
    border-color:#25d68a;
}

.option.wrong{
    background:#65242c;
    border-color:#ff5d6c;
}

.next{
    width:100%;
    padding:16px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#00d4ff,#0077ff);
    color:white;
    font-size:19px;
    font-weight:bold;
    margin-top:12px;
    cursor:pointer;
}

.next:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.secondary{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:1px solid #394454;
    border-radius:14px;
    background:rgba(255,255,255,.06);
    color:white;
    font-size:17px;
    cursor:pointer;
}

/* ================= RESULT ================= */

.result-card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:30px;
    text-align:center;
}

.big-score{
    font-size:48px;
    font-weight:bold;
    margin:20px 0;
    color:#ffd54f;
}

.stat{
    display:inline-block;
    padding:12px 18px;
    margin:5px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
}

.review{
    margin-top:30px;
    text-align:right;
}

.review-item{
    padding:18px;
    margin:12px 0;
    border-radius:15px;
    background:#111822;
    border-right:5px solid #777;
}

.review-correct{
    border-right-color:#25d68a;
}

.review-wrong{
    border-right-color:#ff5d6c;
}

.correct-text{
    color:#25d68a;
    font-weight:bold;
}

.wrong-text{
    color:#ff6877;
    font-weight:bold;
}

.answer-text{
    margin-top:8px;
    color:#dce2ea;
}

/* ================= LEADERBOARD ================= */

.leaderboard-card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:25px;
}

.leaderboard-card h1{
    text-align:center;
}

.lb-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:#121923;
    border:1px solid #293443;
    padding:15px;
    margin:10px 0;
    border-radius:15px;
}

.lb-rank{
    min-width:45px;
    font-weight:bold;
    font-size:20px;
}

.lb-name{
    flex:1;
    font-size:18px;
}

.lb-score{
    font-weight:bold;
    color:#ffd54f;
}

/* ================= HOST ================= */

.host{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    background:#090e16;
    overflow:auto;
    padding:25px;
}

.host-inner{
    max-width:850px;
    margin:auto;
}

.host-card{
    background:#151c27;
    border:1px solid #293443;
    border-radius:20px;
    padding:25px;
}

.host-row{
    background:#0f1620;
    border:1px solid #293443;
    border-radius:15px;
    padding:17px;
    margin:10px 0;
}

.host-title{
    text-align:center;
}

.host-input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border-radius:10px;
    border:1px solid #394454;
    background:#0c121a;
    color:white;
    font-size:17px;
}

.host-button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#1479ff;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.logout{
    background:#a52232;
}

.hidden{
    display:none!important;
}

.host-open{
    position:fixed;
    left:10px;
    bottom:10px;
    z-index:50;
    border:0;
    background:transparent;
    color:white;
    opacity:.18;
    font-size:18px;
    cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .cover h1{
        font-size:32px;
    }

    .cover-card{
        padding:35px 20px;
    }

    #questionText{
        font-size:22px;
    }

    .option{
        font-size:17px;
    }

    .page{
        padding:12px;
    }
}
</style>
</head>

<body>

<!-- ================= COVER ================= -->

<section class="cover" id="cover">

    <div class="cover-card">

        <div class="logo">🚦</div>

        <h1>هێزی شۆفێر</h1>

        <p>
            تاقیکردنەوەی زانیارییەکانی شۆفێری
            <br>
            خۆت تاقی بکەرەوە و بزانە چەند بەهێزی 🚗
        </p>

        <button class="start-btn" onclick="openLogin()">
            🚀 دەستپێکردن
        </button>

    </div>

</section>


<!-- ================= LOGIN ================= -->

<div class="modal" id="loginModal">

    <div class="modal-card">

        <h2>🔐 چوونەژوورەوە</h2>

        <p>
            ناوت بنووسە و وشەی نهێنی داخڵ بکە
        </p>

        <input
            class="input"
            id="userName"
            type="text"
            placeholder="👤 ناوی تۆ"
        >

        <input
            class="input"
            id="userPassword"
            type="password"
            placeholder="🔑 وشەی نهێنی"
        >

        <button
            class="modal-btn enter-btn"
            onclick="login()"
        >
            چوونەژوورەوە
        </button>

        <button
            class="modal-btn close-btn"
            onclick="closeLogin()"
        >
            داخستن
        </button>

    </div>

</div>


<!-- ================= QUIZ ================= -->

<section class="page" id="quizPage">

    <div class="topbar">

        <div class="brand">
            🚦 هێزی شۆفێر
        </div>

        <div class="badge" id="userBadge">
            👤
        </div>

    </div>

    <div class="progress-wrap">
        <div class="progress" id="progress"></div>
    </div>

    <div class="timer" id="timer">
        ⏱️ 40 چرکە
    </div>

    <div class="question-card">

        <div class="question-number" id="questionNumber"></div>

        <h2 id="questionText"></h2>

        <button
            class="option"
            id="option1"
            onclick="chooseAnswer(1)"
        ></button>

        <button
            class="option"
            id="option2"
            onclick="chooseAnswer(2)"
        ></button>

        <button
            class="option"
            id="option3"
            onclick="chooseAnswer(3)"
        ></button>

        <button
            class="next"
            id="nextButton"
            onclick="nextQuestion()"
            disabled
        >
            پرسیاری دواتر ➜
        </button>

    </div>

    <button
        class="secondary"
        onclick="showLeaderboard()"
    >
        🏆 Leaderboard
    </button>

</section>


<!-- ================= LEADERBOARD ================= -->

<section class="page" id="leaderboardPage">

    <div class="leaderboard-card">

        <h1>🏆 Leaderboard</h1>

        <p style="text-align:center;color:#aeb7c5;">
            ئەنجامی بەشداربووان
        </p>

        <div id="leaderboardList">
            چاوەڕێ بە...
        </div>

        <button
            class="secondary"
            onclick="backToQuiz()"
        >
            ↩️ گەڕانەوە
        </button>

    </div>

</section>


<!-- ================= HOST ================= -->

<div class="host" id="hostPanel">

    <div class="host-inner">

        <div class="host-card" id="hostLogin">

            <h1 class="host-title">
                👑 Host
            </h1>

            <p style="text-align:center;color:#adb6c4;">
                تەنیا Host دەتوانێت بەشی بەڕێوەبردن ببینێت.
            </p>

            <input
                class="host-input"
                id="hostEmail"
                type="email"
                placeholder="Email"
            >

            <input
                class="host-input"
                id="hostPassword"
                type="password"
                placeholder="Password"
            >

            <button
                class="host-button"
                onclick="hostLogin()"
            >
                🔐 چوونەژوورەوە
            </button>

            <button
                class="host-button"
                onclick="hideHost()"
            >
                داخستن
            </button>

        </div>


        <div
            class="host-card hidden"
            id="hostResults"
        >

            <h1 class="host-title">
                👑 بەشی Host
            </h1>

            <div id="hostList">
                چاوەڕێ بە...
            </div>

            <button
                class="host-button logout"
                onclick="hostLogout()"
            >
                چوونەدەرەوە
            </button>

        </div>

    </div>

</div>


<button
    class="host-open"
    onclick="showHost()"
>
    👑
</button>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://hqfvkkigcjehttciirfe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e1cjH9G8H8NLaA2t-h0_Pg_azgple4f";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   SYSTEM PASSWORD
===================================================== */

const SYSTEM_PASSWORD =
"H10J10H1999";


/* =====================================================
   VARIABLES
===================================================== */

let questions = [];

let currentQuestion = 0;

let selectedAnswer = null;

let correctAnswers = 0;

let userName = "";

let timeLeft = 40;

let timerInterval = null;

let userResults = [];


/* =====================================================
   LOGIN
===================================================== */

function openLogin(){

    document.getElementById("loginModal").style.display =
        "flex";

}

function closeLogin(){

    document.getElementById("loginModal").style.display =
        "none";

}


async function login(){

    userName =
        document.getElementById("userName")
        .value
        .trim();

    const password =
        document.getElementById("userPassword")
        .value;

    if(!userName){

        alert("تکایە ناوت بنووسە.");

        return;
    }

    if(!password){

        alert("تکایە وشەی نهێنی بنووسە.");

        return;
    }

    if(password !== SYSTEM_PASSWORD){

        alert("❌ وشەی نهێنی هەڵەیە.");

        return;
    }

    document.getElementById("loginModal").style.display =
        "none";

    document.getElementById("cover").style.display =
        "none";

    document.getElementById("quizPage").style.display =
        "block";

    document.getElementById("userBadge").innerText =
        "👤 " + userName;

    await startQuiz();

}


/* =====================================================
   START QUIZ
===================================================== */

async function startQuiz(){

    const {
        data,
        error
    } = await supabaseClient
        .from("questions")
        .select("*");

    if(error){

        console.log(error);

        alert(
            "کێشەیەک لە وەرگرتنی پرسیارەکان هەیە.\n\n" +
            error.message
        );

        return;
    }

    if(!data || data.length === 0){

        alert(
            "هیچ پرسیارێک لە خشتەی questions نییە."
        );

        return;
    }

    questions =
        data.sort(
            () => Math.random() - 0.5
        );

    currentQuestion = 0;

    correctAnswers = 0;

    userResults = [];

    showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    const q =
        questions[currentQuestion];

    selectedAnswer = null;

    document.getElementById("questionNumber")
        .innerText =
        "پرسیاری " +
        (currentQuestion + 1) +
        " لە " +
        questions.length;

    document.getElementById("questionText")
        .innerText =
        q.question || "پرسیار بەتاڵە";

    document.getElementById("option1")
        .innerText =
        "1 ـ " +
        (q.option1 || "بەتاڵە");

    document.getElementById("option2")
        .innerText =
        "2 ـ " +
        (q.option2 || "بەتاڵە");

    document.getElementById("option3")
        .innerText =
        "3 ـ " +
        (q.option3 || "بەتاڵە");


    document.getElementById("option1")
        .className = "option";

    document.getElementById("option2")
        .className = "option";

    document.getElementById("option3")
        .className = "option";


    document.getElementById("nextButton")
        .disabled = true;


    const progress =
        (currentQuestion / questions.length) * 100;

    document.getElementById("progress")
        .style.width =
        progress + "%";


    startTimer();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    clearInterval(timerInterval);

    timeLeft = 40;

    updateTimer();

    timerInterval =
        setInterval(() => {

            timeLeft--;

            updateTimer();

            if(timeLeft <= 0){

                clearInterval(timerInterval);

                if(selectedAnswer === null){

                    selectedAnswer = 0;

                }

                nextQuestion();

            }

        },1000);

}


function updateTimer(){

    const timer =
        document.getElementById("timer");

    timer.innerText =
        "⏱️ " +
        timeLeft +
        " چرکە";

    if(timeLeft <= 10){

        timer.style.color =
            "#ff6877";

    }else{

        timer.style.color =
            "white";

    }

}


/* =====================================================
   CHOOSE ANSWER
===================================================== */

function chooseAnswer(number){

    selectedAnswer = number;

    document.getElementById("option1")
        .className = "option";

    document.getElementById("option2")
        .className = "option";

    document.getElementById("option3")
        .className = "option";

    document.getElementById(
        "option" + number
    ).className =
        "option selected";

    document.getElementById("nextButton")
        .disabled = false;

}


/* =====================================================
   NEXT QUESTION
===================================================== */

async function nextQuestion(){

    clearInterval(timerInterval);

    if(selectedAnswer === null){

        selectedAnswer = 0;

    }

    const q =
        questions[currentQuestion];

    const correctAnswer =
        Number(q.answer);

    const isCorrect =
        Number(selectedAnswer) ===
        correctAnswer;

    if(isCorrect){

        correctAnswers++;

    }


    userResults.push({

        question:
            q.question || "",

        selectedAnswer:
            Number(selectedAnswer),

        correctAnswer:
            correctAnswer,

        option1:
            q.option1 || "",

        option2:
            q.option2 || "",

        option3:
            q.option3 || "",

        isCorrect:
            isCorrect

    });


    currentQuestion++;


    if(
        currentQuestion >=
        questions.length
    ){

        await finishQuiz();

        return;

    }


    showQuestion();

}


/* =====================================================
   FINISH
===================================================== */

async function finishQuiz(){

    clearInterval(timerInterval);

    document.getElementById("progress")
        .style.width = "100%";


    const total =
        questions.length;

    const wrongAnswers =
        total - correctAnswers;


    /* SAVE LEADERBOARD */

    const {
        data: leaderboardData,
        error: leaderboardError
    } =
        await supabaseClient
        .from("leaderboard")
        .insert({

            name:
                userName,

            score:
                correctAnswers,

            total:
                total

        })
        .select()
        .single();


    if(leaderboardError){

        console.log(
            leaderboardError
        );

    }


    let reviewHTML = "";


    userResults.forEach(
        (result,index) => {

            let selectedText =
                "وەڵام نەدراوە";

            let correctText =
                "";


            if(result.selectedAnswer === 1){

                selectedText =
                    "1 ـ " +
                    result.option1;

            }

            if(result.selectedAnswer === 2){

                selectedText =
                    "2 ـ " +
                    result.option2;

            }

            if(result.selectedAnswer === 3){

                selectedText =
                    "3 ـ " +
                    result.option3;

            }


            if(result.correctAnswer === 1){

                correctText =
                    "1 ـ " +
                    result.option1;

            }

            if(result.correctAnswer === 2){

                correctText =
                    "2 ـ " +
                    result.option2;

            }

            if(result.correctAnswer === 3){

                correctText =
                    "3 ـ " +
                    result.option3;

            }


            if(result.isCorrect){

                reviewHTML += `

                    <div class="review-item review-correct">

                        <div style="font-weight:bold;margin-bottom:10px;">
                            ${index + 1}.
                            ${escapeHTML(result.question)}
                        </div>

                        <div class="correct-text">
                            ✅ وەڵامت ڕاستە
                        </div>

                        <div class="answer-text">
                            وەڵامی تۆ:
                            ${escapeHTML(selectedText)}
                        </div>

                    </div>

                `;

            }else{

                reviewHTML += `

                    <div class="review-item review-wrong">

                        <div style="font-weight:bold;margin-bottom:10px;">
                            ${index + 1}.
                            ${escapeHTML(result.question)}
                        </div>

                        <div class="wrong-text">
                            ❌ وەڵامت هەڵەیە
                        </div>

                        <div class="answer-text">
                            وەڵامی تۆ:
                            ${escapeHTML(selectedText)}
                        </div>

                        <div class="correct-text" style="margin-top:8px;">
                            ✅ وەڵامی ڕاست:
                            ${escapeHTML(correctText)}
                        </div>

                    </div>

                `;

            }

        }
    );


    document.getElementById("quizPage")
        .innerHTML = `

        <div class="result-card">

            <div style="font-size:55px;">
                🎉
            </div>

            <h1>
                تاقیکردنەوەکە تەواو بوو
            </h1>

            <p>
                بەخێربێیت
                <strong>
                    ${escapeHTML(userName)}
                </strong>
                🌹
            </p>

            <div class="big-score">
                ${correctAnswers} / ${total}
            </div>

            <div class="stat">
                📋 هەموو:
                ${total}
            </div>

            <div class="stat">
                ✅ ڕاست:
                ${correctAnswers}
            </div>

            <div class="stat">
                ❌ هەڵە:
                ${wrongAnswers}
            </div>

            <div class="review">

                <h2>
                    📋 وردەکاری وەڵامەکان
                </h2>

                ${reviewHTML}

            </div>

            <button
                class="next"
                onclick="showLeaderboard()"
            >
                🏆 Leaderboard
            </button>

            <button
                class="secondary"
                onclick="location.reload()"
            >
                🔄 دووبارە دەستپێکردنەوە
            </button>

        </div>

    `;

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function showLeaderboard(){

    clearInterval(timerInterval);

    document.getElementById("quizPage")
        .style.display = "none";

    document.getElementById("leaderboardPage")
        .style.display = "block";


    const list =
        document.getElementById("leaderboardList");

    list.innerHTML =
        "<p style='text-align:center;'>چاوەڕێ بە...</p>";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("leaderboard")
        .select(
            "name,score,total,created_at"
        )
        .order(
            "score",
            {
                ascending:false
            }
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.log(error);

        list.innerHTML =
            "<p>کێشەیەک لە Leaderboard هەیە.</p>";

        return;

    }


    if(!data || data.length === 0){

        list.innerHTML =
            "<p style='text-align:center;'>" +
            "هێشتا هیچ ئەنجامێک نییە." +
            "</p>";

        return;

    }


    let html = "";


    data.forEach(
        (item,index) => {

            let icon = "🏅";

            if(index === 0)
                icon = "🥇";

            if(index === 1)
                icon = "🥈";

            if(index === 2)
                icon = "🥉";


            html += `

                <div class="lb-row">

                    <div class="lb-rank">
                        ${icon}
                        #${index + 1}
                    </div>

                    <div class="lb-name">
                        👤
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="lb-score">
                        ${item.score}/${item.total}
                    </div>

                </div>

            `;

        }
    );


    list.innerHTML = html;

}


function backToQuiz(){

    document.getElementById("leaderboardPage")
        .style.display = "none";

    document.getElementById("quizPage")
        .style.display = "block";

}


/* =====================================================
   HOST
===================================================== */

function showHost(){

    clearInterval(timerInterval);

    document.getElementById("hostPanel")
        .style.display = "block";

}


function hideHost(){

    document.getElementById("hostPanel")
        .style.display = "none";

}


async function hostLogin(){

    const email =
        document.getElementById("hostEmail")
        .value
        .trim();

    const password =
        document.getElementById("hostPassword")
        .value;


    if(!email || !password){

        alert(
            "تکایە Email و Password بنووسە."
        );

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        alert(
            "❌ چوونەژوورەوە سەرکەوتوو نەبوو."
        );

        console.log(error);

        return;

    }


    const user =
        data.user;


    const {
        data:hostData,
        error:hostError
    } =
        await supabaseClient
        .from("hosts")
        .select("user_id")
        .eq(
            "user_id",
            user.id
        )
        .maybeSingle();


    if(hostError || !hostData){

        await supabaseClient.auth.signOut();

        alert(
            "❌ ئەم ئەکاونتە Host نییە."
        );

        return;

    }


    document.getElementById("hostLogin")
        .classList.add("hidden");

    document.getElementById("hostResults")
        .classList.remove("hidden");


    await loadHostResults();

}


/* =====================================================
   HOST RESULTS
===================================================== */

async function loadHostResults(){

    const list =
        document.getElementById("hostList");

    list.innerHTML =
        "<p>چاوەڕێ بە...</p>";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("leaderboard")
        .select(
            "name,score,total,created_at"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.log(error);

        list.innerHTML =
            "<p>کێشەیەک ڕوویدا.</p>";

        return;

    }


    if(!data || data.length === 0){

        list.innerHTML =
            "<p>هێشتا هیچ ئەنجامێک نییە.</p>";

        return;

    }


    let html = "";


    data.forEach(
        (item,index) => {

            html += `

                <div class="host-row">

                    <strong>
                        #${index + 1}
                    </strong>

                    <br><br>

                    👤 ناو:
                    ${escapeHTML(item.name)}

                    <br>

                    🏆 نمرە:
                    ${item.score}/${item.total}

                    <br>

                    🕒
                    ${item.created_at
                        ? new Date(item.created_at)
                            .toLocaleString("ku-IQ")
                        : ""
                    }

                </div>

            `;

        }
    );


    list.innerHTML = html;

}


/* =====================================================
   HOST LOGOUT
===================================================== */

async function hostLogout(){

    await supabaseClient.auth.signOut();

    document.getElementById("hostResults")
        .classList.add("hidden");

    document.getElementById("hostLogin")
        .classList.remove("hidden");

    document.getElementById("hostEmail")
        .value = "";

    document.getElementById("hostPassword")
        .value = "";

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}
