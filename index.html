<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هێزی شۆفێر | Driving Challenge</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Noto Sans Arabic",Arial,sans-serif;
    background:#02050a;
    color:#fff;
}

/* =========================
   COVER
========================= */

#landing{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    z-index:1;
}

#landing .cover-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
}

/* ئەم دوگمەیە تەنها کلیک لەسەر شوێنی
   "دەستپێکردنی چالاکی" دەکات */
.cover-start{
    position:absolute;
    z-index:10;
    left:50%;
    bottom:3%;
    transform:translateX(-50%);
    width:min(430px,82vw);
    height:90px;
    border:0;
    background:transparent;
    cursor:pointer;
}

/* =========================
   LOGIN
========================= */

#loginModal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(10px);
}

#loginModal.show{
    display:flex;
}

.login-box{
    width:min(440px,95vw);
    padding:28px;
    border-radius:25px;
    background:linear-gradient(145deg,#111c30,#05080e);
    border:1px solid #00eaff55;
    box-shadow:0 0 60px #00eaff22;
}

.login-box h2{
    text-align:center;
    color:#00eaff;
    margin-bottom:8px;
    font-size:27px;
}

.login-box .desc{
    text-align:center;
    color:#9da8b8;
    margin-bottom:20px;
}

.input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:14px;
    border:1px solid #ffffff22;
    background:#ffffff08;
    color:#fff;
    font-size:16px;
    outline:none;
}

.input:focus{
    border-color:#00eaff;
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
}

.btn-primary{
    color:#001018;
    background:linear-gradient(135deg,#00eaff,#287cff);
}

.btn-secondary{
    margin-top:10px;
    color:#fff;
    background:#ffffff0b;
    border:1px solid #ffffff20;
}

/* =========================
   QUIZ
========================= */

#quiz{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    background:
        radial-gradient(circle at top,#10233d,#02050a 55%);
}

.quiz-container{
    width:min(900px,100%);
    margin:auto;
}

.quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.quiz-logo{
    color:#00eaff;
    font-size:23px;
    font-weight:900;
}

.stats{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.stat{
    padding:7px 13px;
    border-radius:12px;
    background:#ffffff09;
    border:1px solid #ffffff14;
}

.progress{
    width:100%;
    height:7px;
    background:#ffffff12;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00eaff,#287cff);
    transition:.3s;
}

.timer{
    text-align:center;
    color:#00eaff;
    font-size:20px;
    font-weight:900;
    margin-bottom:15px;
}

.question-box{
    padding:25px;
    border-radius:25px;
    background:linear-gradient(145deg,#111a29,#06090f);
    border:1px solid #ffffff12;
}

.question-number{
    color:#8d99aa;
    margin-bottom:8px;
}

.question{
    font-size:22px;
    line-height:1.8;
    margin-bottom:20px;
}

.option{
    width:100%;
    display:block;
    padding:15px;
    margin:9px 0;
    border-radius:15px;
    border:1px solid #ffffff16;
    background:#ffffff08;
    color:#fff;
    text-align:right;
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    border-color:#00eaff66;
}

.option.selected{
    border-color:#00eaff;
    background:#00eaff18;
}

.option.correct{
    border-color:#26e66b;
    background:#26e66b18;
}

.option.wrong{
    border-color:#ff4141;
    background:#ff414118;
}

.next-btn{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,#00eaff,#287cff);
    color:#001018;
    font-family:inherit;
    font-weight:900;
    cursor:pointer;
}

.next-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================
   RESULT
========================= */

#result{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    background:#03060c;
}

.result-box{
    width:min(850px,100%);
    margin:auto;
    padding:30px;
    border-radius:25px;
    background:linear-gradient(145deg,#111a29,#06090f);
    border:1px solid #ffffff12;
    text-align:center;
}

.score{
    font-size:65px;
    font-weight:900;
    color:#00eaff;
    margin:20px 0;
}

.result-info{
    line-height:2;
    color:#d7dce5;
}

/* =========================
   LEADERBOARD
========================= */

#leaderboard{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    background:#03060c;
}

.leaderboard-box{
    width:min(850px,100%);
    margin:auto;
    padding:25px;
    border-radius:25px;
    background:linear-gradient(145deg,#111a29,#06090f);
    border:1px solid #ffffff12;
}

.leaderboard-box h2{
    text-align:center;
    color:#00eaff;
    margin-bottom:20px;
}

.lb-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    margin:8px 0;
    border-radius:14px;
    background:#ffffff08;
}

.lb-name{
    flex:1;
}

.lb-score{
    color:#00eaff;
    font-weight:900;
}

/* =========================
   HOST
========================= */

#hostBox{
    display:none;
    min-height:100vh;
    padding:25px 15px;
    background:#03060c;
}

.host-box{
    width:min(850px,100%);
    margin:auto;
    padding:25px;
    border-radius:25px;
    background:linear-gradient(145deg,#111a29,#06090f);
    border:1px solid #ffffff12;
}

.host-box h2{
    text-align:center;
    color:#00eaff;
    margin-bottom:20px;
}

.host-result{
    padding:15px;
    margin:8px 0;
    border-radius:14px;
    background:#ffffff08;
    line-height:2;
}

.host-button{
    position:fixed;
    left:10px;
    bottom:10px;
    z-index:200;
    border:0;
    background:transparent;
    color:#ffffff25;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .cover-start{
        width:86vw;
        height:75px;
        bottom:3%;
    }

    .quiz-top{
        flex-direction:column;
        align-items:stretch;
    }

    .stats{
        justify-content:center;
    }

    .question{
        font-size:19px;
    }

    .login-box{
        padding:22px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     START COVER
     ===================================================== -->

<section id="landing">

    <img
        class="cover-image"
        src="./68291.png"
        alt="هێزی شۆفێر"
    >

    <button
        class="cover-start"
        onclick="openLogin()"
        aria-label="دەستپێکردنی چالاکی">
    </button>

</section>


<!-- =====================================================
     LOGIN
     ===================================================== -->

<div id="loginModal">

    <div class="login-box">

        <h2>🚘 چوونەژوورەوە</h2>

        <div class="desc">
            زانیارییەکانت بنووسە بۆ دەستپێکردنی چالاکی
        </div>

        <input
            id="name"
            class="input"
            type="text"
            placeholder="👤 ناوی بەکارهێنەر"
        >

        <input
            id="phone"
            class="input"
            type="tel"
            placeholder="📱 ژمارەی مۆبایل"
        >

        <button
            class="btn btn-primary"
            onclick="login()">
            🚘 چوونەژوورەوە
        </button>

        <button
            class="btn btn-secondary"
            onclick="closeLogin()">
            داخستن
        </button>

    </div>

</div>


<!-- =====================================================
     QUIZ
     ===================================================== -->

<section id="quiz">

    <div class="quiz-container">

        <div class="quiz-top">

            <div class="quiz-logo">
                🚘 هێزی شۆفێر
            </div>

            <div class="stats">

                <div class="stat">
                    ⭐ <span id="xp">0</span>
                </div>

                <div class="stat">
                    🔥 <span id="combo">0</span>
                </div>

                <div class="stat">
                    ❤️ <span id="lives">3</span>
                </div>

            </div>

        </div>

        <div class="progress">
            <div
                id="progressBar"
                class="progress-bar">
            </div>
        </div>

        <div
            id="timer"
            class="timer">
            ⏱️ 40 چرکە
        </div>

        <div class="question-box">

            <div
                id="questionNumber"
                class="question-number">
            </div>

            <div
                id="questionText"
                class="question">
            </div>

            <button
                id="option1"
                class="option"
                onclick="chooseAnswer(1)">
            </button>

            <button
                id="option2"
                class="option"
                onclick="chooseAnswer(2)">
            </button>

            <button
                id="option3"
                class="option"
                onclick="chooseAnswer(3)">
            </button>

            <button
                id="nextButton"
                class="next-btn"
                onclick="nextQuestion()"
                disabled>
                پرسیاری دواتر ←
            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     RESULT
     ===================================================== -->

<section id="result">

    <div class="result-box">

        <h2>🏁 کۆتایی چالاکی</h2>

        <div
            id="score"
            class="score">
            0%
        </div>

        <div
            id="resultText"
            class="result-info">
        </div>

        <button
            class="btn btn-primary"
            style="margin-top:20px"
            onclick="showLeaderboard()">
            🏆 Leaderboard
        </button>

        <button
            class="btn btn-secondary"
            onclick="location.reload()">
            🔄 دووبارە یاری کردن
        </button>

    </div>

</section>


<!-- =====================================================
     LEADERBOARD
     ===================================================== -->

<section id="leaderboard">

    <div class="leaderboard-box">

        <h2>🏆 Leaderboard</h2>

        <div id="leaderboardList"></div>

        <button
            class="btn btn-primary"
            style="margin-top:15px"
            onclick="backToQuiz()">
            ↩️ گەڕانەوە
        </button>

    </div>

</section>


<!-- =====================================================
     HOST
     ===================================================== -->

<section id="hostBox">

    <div
        id="hostLoginBox"
        class="host-box">

        <h2>👑 Host</h2>

        <input
            id="hostEmail"
            class="input"
            type="email"
            placeholder="Email"
        >

        <input
            id="hostPassword"
            class="input"
            type="password"
            placeholder="Password"
        >

        <button
            class="btn btn-primary"
            onclick="hostLogin()">
            چوونەژوورەوە
        </button>

    </div>


    <div
        id="hostResultsBox"
        class="host-box"
        style="display:none">

        <h2>👑 ئەنجامەکان</h2>

        <div id="hostResults"></div>

        <button
            class="btn btn-secondary"
            onclick="hostLogout()">
            چوونەدەرەوە
        </button>

    </div>

</section>


<button
    class="host-button"
    onclick="showHost()">
    👑
</button>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://hqfvkkigcjehttciirfe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e1cjH9G8H8NLaA2t-h0_Pg_azgple4f";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let questions = [];

let currentQuestion = 0;

let selectedAnswer = 0;

let correctAnswers = 0;

let xp = 0;

let combo = 0;

let maxCombo = 0;

let lives = 3;

let playerName = "";

let playerPhone = "";

let timer = null;

let timeLeft = 40;


/* =====================================================
   LOGIN
===================================================== */

function openLogin(){

    document
        .getElementById("loginModal")
        .classList.add("show");

}


function closeLogin(){

    document
        .getElementById("loginModal")
        .classList.remove("show");

}


async function login(){

    playerName =
        document
        .getElementById("name")
        .value
        .trim();

    playerPhone =
        document
        .getElementById("phone")
        .value
        .trim();


    if(!playerName){

        alert("تکایە ناوت بنووسە");

        return;
    }


    if(!playerPhone){

        alert("تکایە ژمارەی مۆبایل بنووسە");

        return;
    }


    closeLogin();

    document
        .getElementById("landing")
        .style.display="none";

    await startQuiz();

}


/* =====================================================
   START QUIZ
===================================================== */

async function startQuiz(){

    const {data,error} =
        await db
        .from("questions")
        .select("*");


    if(error){

        alert(
            "کێشە لە هێنانی پرسیارەکان:\n"
            + error.message
        );

        document
            .getElementById("landing")
            .style.display="block";

        return;
    }


    if(!data || data.length===0){

        alert("هیچ پرسیارێک نەدۆزرایەوە");

        document
            .getElementById("landing")
            .style.display="block";

        return;
    }


    questions =
        data.sort(
            () => Math.random() - 0.5
        );


    currentQuestion = 0;
    correctAnswers = 0;
    xp = 0;
    combo = 0;
    maxCombo = 0;
    lives = 3;


    document
        .getElementById("quiz")
        .style.display="block";


    updateStats();

    showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    clearInterval(timer);

    selectedAnswer = 0;


    const q =
        questions[currentQuestion];


    document
        .getElementById("questionNumber")
        .innerText =
        `پرسیاری ${currentQuestion+1} لە ${questions.length}`;


    document
        .getElementById("questionText")
        .innerText =
        q.question ||
        q.question_text ||
        q.text ||
        "";


    document
        .getElementById("option1")
        .innerText =
        "1 ـ " +
        (
            q.option1 ||
            q.option_a ||
            q.a ||
            ""
        );


    document
        .getElementById("option2")
        .innerText =
        "2 ـ " +
        (
            q.option2 ||
            q.option_b ||
            q.b ||
            ""
        );


    document
        .getElementById("option3")
        .innerText =
        "3 ـ " +
        (
            q.option3 ||
            q.option_c ||
            q.c ||
            ""
        );


    for(let i=1;i<=3;i++){

        const btn =
            document.getElementById(
                "option"+i
            );

        btn.classList.remove("selected");
        btn.classList.remove("correct");
        btn.classList.remove("wrong");

    }


    document
        .getElementById("nextButton")
        .disabled=true;


    document
        .getElementById("progressBar")
        .style.width =
        (
            currentQuestion /
            questions.length *
            100
        ) + "%";


    startTimer();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    timeLeft = 40;

    updateTimer();


    timer =
        setInterval(() => {

            timeLeft--;

            updateTimer();


            if(timeLeft <= 0){

                clearInterval(timer);

                nextQuestion();

            }

        },1000);

}


function updateTimer(){

    document
        .getElementById("timer")
        .innerText =
        "⏱️ " +
        timeLeft +
        " چرکە";

}


/* =====================================================
   ANSWER
===================================================== */

function chooseAnswer(number){

    selectedAnswer = number;


    for(let i=1;i<=3;i++){

        document
            .getElementById("option"+i)
            .classList.remove("selected");

    }


    document
        .getElementById("option"+number)
        .classList.add("selected");


    document
        .getElementById("nextButton")
        .disabled=false;

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

    clearInterval(timer);


    const q =
        questions[currentQuestion];


    let correct =
        q.answer ??
        q.correct_answer ??
        q.correct;


    correct =
        Number(correct);


    if(
        selectedAnswer &&
        selectedAnswer === correct
    ){

        correctAnswers++;

        combo++;

        maxCombo =
            Math.max(
                maxCombo,
                combo
            );

        xp +=
            10 +
            Math.min(
                combo * 2,
                20
            );

    }
    else{

        combo = 0;

        lives--;

    }


    updateStats();


    currentQuestion++;


    if(
        currentQuestion >=
        questions.length
    ){

        finishQuiz();

        return;
    }


    showQuestion();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document
        .getElementById("xp")
        .innerText=xp;

    document
        .getElementById("combo")
        .innerText=combo;

    document
        .getElementById("lives")
        .innerText=lives;

}


/* =====================================================
   FINISH
===================================================== */

async function finishQuiz(){

    clearInterval(timer);


    document
        .getElementById("quiz")
        .style.display="none";


    document
        .getElementById("result")
        .style.display="block";


    const total =
        questions.length;


    const percentage =
        Math.round(
            correctAnswers /
            total *
            100
        );


    document
        .getElementById("score")
        .innerText =
        percentage + "%";


    document
        .getElementById("resultText")
        .innerHTML = `

            <div>👤 ${escapeHTML(playerName)}</div>

            <div>
                ✅ ڕاست:
                ${correctAnswers}
                لە
                ${total}
            </div>

            <div>
                ⭐ XP:
                ${xp}
            </div>

            <div>
                🔥 Max Combo:
                ${maxCombo}
            </div>

        `;


    try{

        const {data,error} =
            await db
            .from("leaderboard")
            .insert({

                name:playerName,

                score:correctAnswers,

                total:total

            })
            .select()
            .single();


        if(
            !error &&
            data
        ){

            await db
                .from("private_results")
                .insert({

                    leaderboard_id:data.id,

                    phone:playerPhone

                });

        }

    }
    catch(e){

        console.log(e);

    }

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function showLeaderboard(){

    document
        .getElementById("result")
        .style.display="none";


    document
        .getElementById("leaderboard")
        .style.display="block";


    const list =
        document
        .getElementById("leaderboardList");


    list.innerHTML =
        "جارێک چاوەڕێ بکە...";


    const {data,error} =
        await db
        .from("leaderboard")
        .select("*")
        .order(
            "score",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML =
            "کێشە لە هێنانی Leaderboard";

        return;
    }


    if(!data || !data.length){

        list.innerHTML =
            "هیچ ئەنجامێک نییە";

        return;
    }


    list.innerHTML =
        data.map(
            (item,index) => {

                const medal =
                    index === 0
                    ? "🥇"
                    : index === 1
                    ? "🥈"
                    : index === 2
                    ? "🥉"
                    : "#" + (index+1);


                return `

                    <div class="lb-row">

                        <b>${medal}</b>

                        <div class="lb-name">
                            ${escapeHTML(item.name)}
                        </div>

                        <div class="lb-score">
                            ${item.score}/${item.total}
                        </div>

                    </div>

                `;

            }
        ).join("");

}


function backToQuiz(){

    document
        .getElementById("leaderboard")
        .style.display="none";


    document
        .getElementById("result")
        .style.display="block";

}


/* =====================================================
   HOST
===================================================== */

function showHost(){

    document
        .getElementById("landing")
        .style.display="none";

    document
        .getElementById("quiz")
        .style.display="none";

    document
        .getElementById("result")
        .style.display="none";

    document
        .getElementById("leaderboard")
        .style.display="none";

    document
        .getElementById("hostBox")
        .style.display="block";

}


async function hostLogin(){

    const email =
        document
        .getElementById("hostEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("hostPassword")
        .value;


    if(!email || !password){

        alert(
            "Email و Password بنووسە"
        );

        return;
    }


    const {data,error} =
        await db.auth.signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        alert(
            "چوونەژوورەوە سەرکەوتوو نەبوو"
        );

        return;
    }


    const {data:host,error:hostError} =
        await db
        .from("hosts")
        .select("*")
        .eq(
            "user_id",
            data.user.id
        )
        .maybeSingle();


    if(
        hostError ||
        !host
    ){

        await db.auth.signOut();

        alert(
            "ئەم ئەکاونتە Host نییە"
        );

        return;
    }


    document
        .getElementById("hostLoginBox")
        .style.display="none";


    document
        .getElementById("hostResultsBox")
        .style.display="block";


    loadHostResults();

}


async function loadHostResults(){

    const box =
        document
        .getElementById("hostResults");


    box.innerHTML =
        "جارێک چاوەڕێ بکە...";


    const {data,error} =
        await db
        .from("private_results")
        .select(`
            phone,
            created_at,
            leaderboard(
                name,
                score,
                total
            )
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        box.innerHTML =
            "کێشە لە هێنانی ئەنجامەکان";

        return;
    }


    if(!data || !data.length){

        box.innerHTML =
            "هیچ ئەنجامێک نییە";

        return;
    }


    box.innerHTML =
        data.map(
            (item,index) => {

                const lb =
                    item.leaderboard || {};


                return `

                    <div class="host-result">

                        <b>
                            #${index+1}
                        </b>

                        <br>

                        👤
                        ${escapeHTML(
                            lb.name || ""
                        )}

                        <br>

                        📱
                        ${escapeHTML(
                            item.phone || ""
                        )}

                        <br>

                        🏆
                        ${lb.score || 0}
                        /
                        ${lb.total || 0}

                    </div>

                `;

            }
        ).join("");

}


async function hostLogout(){

    await db.auth.signOut();

    location.reload();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
