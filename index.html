<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>هێزی شۆفێر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  overflow-x:hidden;
  background:#02050b;
  color:#fff;
  font-family:"Noto Sans Arabic",Tahoma,sans-serif;
}

button,input{
  font-family:inherit;
}

:root{
  --blue:#09a9ff;
  --blue2:#315cff;
  --gold:#ffc84a;
  --red:#ff3158;
  --glass:rgba(7,13,27,.62);
}

/* ================= BACKGROUND ================= */

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-10;
  background:
    radial-gradient(circle at 50% 20%,rgba(0,145,255,.15),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(0,95,255,.09),transparent 30%),
    #02050b;
}

/* ================= HERO ================= */

.hero{
  position:relative;
  min-height:100svh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  isolation:isolate;
}

/* stars */

.stars,
.stars:before,
.stars:after{
  position:absolute;
  inset:0;
  content:"";
  pointer-events:none;
}

.stars{
  opacity:.7;
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1.5px),
    radial-gradient(circle,#78cfff 1px,transparent 1.5px),
    radial-gradient(circle,#fff 1px,transparent 1.5px);
  background-size:130px 130px,190px 190px,270px 270px;
  background-position:20px 40px,80px 10px,130px 90px;
  animation:starsMove 30s linear infinite;
}

@keyframes starsMove{
  from{transform:translateY(0)}
  to{transform:translateY(130px)}
}

/* moon */

.moon{
  position:absolute;
  top:8%;
  left:8%;
  width:95px;
  height:95px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 25px #fff,
    0 0 80px rgba(110,205,255,.5);
  opacity:.9;
}

.moon:after{
  content:"";
  position:absolute;
  width:95px;
  height:95px;
  border-radius:50%;
  left:28px;
  top:-12px;
  background:#050913;
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  top:18px;
  left:3%;
  right:3%;
  z-index:20;
  height:64px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(2,7,18,.65);
  backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.logo{
  font-weight:900;
  font-size:20px;
  white-space:nowrap;
}

.logo span{
  color:var(--blue);
  text-shadow:0 0 20px rgba(0,170,255,.7);
}

.nav{
  display:flex;
  align-items:center;
  gap:28px;
  font-size:13px;
  color:#c9d9ec;
}

.nav a{
  color:inherit;
  text-decoration:none;
  transition:.25s;
}

.nav a:hover{
  color:#fff;
}

.mode{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(255,255,255,.06);
}

/* ================= HERO TEXT ================= */

.hero-content{
  position:relative;
  z-index:12;
  width:min(1100px,92%);
  text-align:center;
  padding-top:100px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 16px;
  border:1px solid rgba(0,170,255,.35);
  background:rgba(0,140,255,.08);
  color:#9bdfff;
  border-radius:999px;
  font-size:12px;
  box-shadow:0 0 30px rgba(0,140,255,.08);
}

.hero-title{
  margin-top:12px;
  font-size:clamp(48px,9vw,105px);
  line-height:1.15;
  font-weight:900;
  letter-spacing:0;
  text-shadow:
    0 0 20px rgba(0,150,255,.35),
    0 0 80px rgba(0,100,255,.18);
}

.hero-title span{
  color:#13aaff;
}

.hero-text{
  max-width:720px;
  margin:10px auto 25px;
  color:#dcecff;
  line-height:2;
  font-size:clamp(14px,2vw,19px);
}

/* ================= BUTTON ================= */

.start-btn{
  position:relative;
  overflow:hidden;
  border:0;
  border-radius:17px;
  padding:14px 28px;
  color:#fff;
  font-size:16px;
  font-weight:800;
  background:linear-gradient(135deg,#079cff,#354cff);
  box-shadow:
    0 0 25px rgba(0,150,255,.35),
    0 12px 35px rgba(0,0,0,.35);
  cursor:pointer;
  transition:.25s;
}

.start-btn:before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:80%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.4),
    transparent
  );
  transform:skewX(-20deg);
  animation:buttonLight 3s infinite;
}

@keyframes buttonLight{
  0%,50%{left:-120%}
  75%,100%{left:140%}
}

.start-btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 0 45px rgba(0,150,255,.6);
}

/* ================= STATS ================= */

.stats{
  margin-top:22px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}

.stat{
  min-width:125px;
  padding:9px 16px;
  border-radius:15px;
  background:rgba(3,9,20,.58);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
}

.stat b{
  display:block;
  font-size:18px;
}

.stat small{
  color:#9eafc5;
}

/* ================= FIGURE 8 ROAD ================= */

.track-zone{
  position:absolute;
  z-index:2;
  left:50%;
  bottom:-5%;
  width:min(1000px,100vw);
  height:570px;
  transform:translateX(-50%);
  perspective:900px;
  pointer-events:none;
}

.track-glow{
  position:absolute;
  left:50%;
  top:50%;
  width:680px;
  height:430px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(
      ellipse,
      rgba(0,150,255,.22),
      transparent 65%
    );
  filter:blur(35px);
}

/* SVG track */

.track-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  filter:
    drop-shadow(0 0 12px rgba(0,150,255,.25))
    drop-shadow(0 0 30px rgba(0,100,255,.15));
}

/* road animation */

.roadDash{
  stroke-dasharray:18 20;
  animation:roadDash 1.2s linear infinite;
}

@keyframes roadDash{
  to{stroke-dashoffset:-38}
}

/* ================= CAR ================= */

.car-wrap{
  position:absolute;
  left:50%;
  top:51%;
  width:270px;
  height:130px;
  transform:
    translate(-50%,-50%)
    rotate(-7deg);
  animation:
    driveFigure8 9s cubic-bezier(.55,.05,.45,.95) infinite,
    carBounce .55s ease-in-out infinite alternate;
  filter:
    drop-shadow(0 0 12px rgba(255,30,70,.4))
    drop-shadow(0 20px 20px rgba(0,0,0,.65));
}

.car{
  width:100%;
  height:100%;
  overflow:visible;
}

.carLight{
  animation:headlight 1.4s ease-in-out infinite alternate;
}

@keyframes headlight{
  from{opacity:.55}
  to{opacity:1}
}

@keyframes carBounce{
  from{margin-top:-2px}
  to{margin-top:3px}
}

/*
  The car follows a visual figure-eight path.
*/

@keyframes driveFigure8{

  0%{
    transform:
      translate(-50%,-50%)
      translate(-260px,0)
      rotate(-5deg)
      scale(.82);
  }

  12%{
    transform:
      translate(-50%,-50%)
      translate(-170px,-70px)
      rotate(-25deg)
      scale(.9);
  }

  25%{
    transform:
      translate(-50%,-50%)
      translate(0,-105px)
      rotate(0deg)
      scale(1);
  }

  37%{
    transform:
      translate(-50%,-50%)
      translate(170px,-70px)
      rotate(25deg)
      scale(.9);
  }

  50%{
    transform:
      translate(-50%,-50%)
      translate(260px,0)
      rotate(5deg)
      scale(.82);
  }

  62%{
    transform:
      translate(-50%,-50%)
      translate(170px,70px)
      rotate(-25deg)
      scale(.9);
  }

  75%{
    transform:
      translate(-50%,-50%)
      translate(0,105px)
      rotate(0deg)
      scale(1);
  }

  87%{
    transform:
      translate(-50%,-50%)
      translate(-170px,70px)
      rotate(25deg)
      scale(.9);
  }

  100%{
    transform:
      translate(-50%,-50%)
      translate(-260px,0)
      rotate(-5deg)
      scale(.82);
  }
}

/* ================= ROAD LIGHTS ================= */

.road-lights{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.light-dot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#ffc84a;
  box-shadow:
    0 0 8px #ffc84a,
    0 0 18px rgba(255,200,74,.8);
}

.l1{left:24%;top:54%}
.l2{left:31%;top:34%}
.l3{left:45%;top:22%}
.l4{left:61%;top:27%}
.l5{left:76%;top:47%}
.l6{left:69%;top:67%}
.l7{left:52%;top:78%}
.l8{left:36%;top:68%}

.l1,.l5{animation:blink 1s infinite}
.l2,.l6{animation:blink 1.3s .2s infinite}
.l3,.l7{animation:blink 1.1s .4s infinite}
.l4,.l8{animation:blink 1.5s .6s infinite}

@keyframes blink{
  50%{opacity:.25}
}

/* ================= HORIZON ================= */

.horizon{
  position:absolute;
  z-index:1;
  left:0;
  right:0;
  bottom:0;
  height:280px;
  background:
    linear-gradient(
      to top,
      #02050b 0%,
      rgba(2,5,11,.92) 32%,
      transparent 100%
    );
  pointer-events:none;
}

/* ================= COUNTDOWN ================= */

.countdown{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(12px);
}

.countdown.show{
  display:grid;
}

.count-number{
  font-size:clamp(100px,25vw,250px);
  font-weight:900;
  color:#fff;
  text-shadow:
    0 0 20px #08aaff,
    0 0 80px #08aaff;
  animation:countPop .75s ease;
}

@keyframes countPop{
  from{
    transform:scale(1.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

/* ================= QUIZ ================= */

.quiz{
  display:none;
  min-height:100svh;
  padding:90px 18px 40px;
  background:
    radial-gradient(circle at 50% 0%,rgba(0,150,255,.12),transparent 40%),
    #02050b;
}

.quiz.active{
  display:block;
}

.quiz-inner{
  width:min(850px,100%);
  margin:auto;
}

.quiz-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.quiz-title{
  font-size:22px;
  font-weight:900;
}

.timer{
  min-width:75px;
  text-align:center;
  padding:8px 13px;
  border-radius:13px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  color:#7ed6ff;
  font-weight:900;
}

.progress{
  height:7px;
  background:#101827;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

.progress i{
  display:block;
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#09a9ff,#685cff);
  box-shadow:0 0 18px #09a9ff;
  transition:.35s;
}

.question-card{
  padding:25px;
  border-radius:25px;
  background:rgba(7,13,27,.72);
  border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.question{
  font-size:clamp(18px,3vw,26px);
  line-height:1.9;
  font-weight:800;
  margin-bottom:20px;
}

.options{
  display:grid;
  gap:11px;
}

.option{
  width:100%;
  padding:15px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.035);
  color:#fff;
  text-align:right;
  font-size:15px;
  line-height:1.8;
  cursor:pointer;
  transition:.2s;
}

.option:hover{
  border-color:#09a9ff;
  background:rgba(0,150,255,.08);
  transform:translateX(-3px);
}

.option.selected{
  border-color:#09a9ff;
  background:rgba(0,150,255,.16);
}

.next{
  margin-top:18px;
  width:100%;
  padding:13px;
  border:0;
  border-radius:15px;
  color:#fff;
  background:linear-gradient(135deg,#087fff,#4a49ff);
  font-weight:800;
  cursor:pointer;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

  .topbar{
    top:10px;
    left:12px;
    right:12px;
    height:54px;
    padding:0 13px;
  }

  .logo{
    font-size:16px;
  }

  .nav{
    display:none;
  }

  .moon{
    width:65px;
    height:65px;
  }

  .moon:after{
    width:65px;
    height:65px;
    left:19px;
  }

  .hero-content{
    padding-top:80px;
  }

  .hero-title{
    font-size:clamp(45px,14vw,70px);
  }

  .hero-text{
    font-size:13px;
    line-height:1.9;
  }

  .track-zone{
    bottom:-20px;
    height:420px;
    transform:translateX(-50%) scale(.82);
  }

  .car-wrap{
    width:230px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    min-width:105px;
    padding:7px 10px;
  }

  .stat small{
    font-size:10px;
  }
}

/* ================= HIDE HERO WHEN QUIZ ================= */

body.quiz-mode .hero{
  display:none;
}

body.quiz-mode .quiz{
  display:block;
}
</style>
</head>

<body>

<!-- ================= HERO ================= -->

<section class="hero" id="home">

  <div class="stars"></div>
  <div class="moon"></div>

  <header class="topbar">
    <div class="logo">
      🚘 هێزی <span>شۆفێر</span>
    </div>

    <nav class="nav">
      <a href="#home">سەرەتا</a>
      <a href="#quiz">تاقیکردنەوە</a>
      <a href="#">ڕیزبەندی</a>
      <a href="#">دەربارە</a>
    </nav>

    <div class="mode">🌙</div>
  </header>

  <!-- FIGURE 8 -->

  <div class="track-zone">

    <div class="track-glow"></div>

    <svg
      class="track-svg"
      viewBox="0 0 1000 570"
      xmlns="http://www.w3.org/2000/svg"
    >

      <!-- shadow -->
      <path
        d="M500 285
           C230 40 70 145 160 285
           C250 425 430 390 500 285
           C570 180 750 145 840 285
           C930 425 770 530 500 285"
        fill="none"
        stroke="#000"
        stroke-width="130"
        opacity=".75"
      />

      <!-- road -->
      <path
        d="M500 285
           C230 40 70 145 160 285
           C250 425 430 390 500 285
           C570 180 750 145 840 285
           C930 425 770 530 500 285"
        fill="none"
        stroke="#161d29"
        stroke-width="108"
      />

      <!-- blue road edge -->
      <path
        d="M500 285
           C230 40 70 145 160 285
           C250 425 430 390 500 285
           C570 180 750 145 840 285
           C930 425 770 530 500 285"
        fill="none"
        stroke="#0b8fd6"
        stroke-width="4"
        opacity=".8"
      />

      <!-- center line -->
      <path
        class="roadDash"
        d="M500 285
           C230 40 70 145 160 285
           C250 425 430 390 500 285
           C570 180 750 145 840 285
           C930 425 770 530 500 285"
        fill="none"
        stroke="#e9f7ff"
        stroke-width="3"
        opacity=".75"
      />

    </svg>

    <div class="road-lights">
      <i class="light-dot l1"></i>
      <i class="light-dot l2"></i>
      <i class="light-dot l3"></i>
      <i class="light-dot l4"></i>
      <i class="light-dot l5"></i>
      <i class="light-dot l6"></i>
      <i class="light-dot l7"></i>
      <i class="light-dot l8"></i>
    </div>

    <!-- ================= SPORTS CAR ================= -->

    <div class="car-wrap">

      <svg
        class="car"
        viewBox="0 0 600 280"
        xmlns="http://www.w3.org/2000/svg"
      >

        <defs>

          <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#343b4a"/>
            <stop offset=".35" stop-color="#111722"/>
            <stop offset=".7" stop-color="#05080e"/>
            <stop offset="1" stop-color="#252c38"/>
          </linearGradient>

          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#bcecff" stop-opacity=".85"/>
            <stop offset=".35" stop-color="#173c58"/>
            <stop offset="1" stop-color="#02060b"/>
          </linearGradient>

          <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff1648"/>
            <stop offset=".5" stop-color="#ff4c69"/>
            <stop offset="1" stop-color="#8c0025"/>
          </linearGradient>

          <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff"/>
            <stop offset=".45" stop-color="#9be8ff"/>
            <stop offset="1" stop-color="#00aaff"/>
          </linearGradient>

          <filter id="glow">
            <feGaussianBlur stdDeviation="7"/>
          </filter>

          <filter id="redGlow">
            <feGaussianBlur stdDeviation="8"/>
          </filter>

        </defs>

        <!-- red tail glow -->

        <ellipse
          cx="130"
          cy="202"
          rx="75"
          ry="22"
          fill="#ff174f"
          opacity=".25"
          filter="url(#redGlow)"
        />

        <!-- shadow -->

        <ellipse
          cx="300"
          cy="237"
          rx="240"
          ry="23"
          fill="#000"
          opacity=".75"
        />

        <!-- wheels -->

        <g>
          <ellipse cx="177" cy="205" rx="38" ry="51" fill="#030509"/>
          <ellipse cx="177" cy="205" rx="24" ry="35" fill="#151c27"/>
          <ellipse cx="177" cy="205" rx="10" ry="17" fill="#6e7b8e"/>

          <ellipse cx="430" cy="205" rx="38" ry="51" fill="#030509"/>
          <ellipse cx="430" cy="205" rx="24" ry="35" fill="#151c27"/>
          <ellipse cx="430" cy="205" rx="10" ry="17" fill="#6e7b8e"/>
        </g>

        <!-- car body -->

        <path
          d="
          M90 198
          C98 161 130 141 176 132
          L238 87
          C266 66 305 57 344 62
          L415 83
          C446 93 473 112 492 138
          L523 155
          C546 168 558 183 554 201
          L532 214
          L84 214
          C75 210 77 202 90 198Z"
          fill="url(#body)"
          stroke="#536072"
          stroke-width="3"
        />

        <!-- roof -->

        <path
          d="
          M205 127
          L252 91
          C275 73 303 69 335 72
          L403 91
          C423 97 443 111 456 129
          Z"
          fill="#090e17"
          stroke="#69778a"
          stroke-width="2"
        />

        <!-- windshield -->

        <path
          d="
          M258 94
          C278 78 301 75 327 77
          L343 80
          L333 126
          L224 126
          Z"
          fill="url(#glass)"
        />

        <!-- side glass -->

        <path
          d="
          M350 81
          L400 96
          C420 102 436 114 448 127
          L341 127
          Z"
          fill="url(#glass)"
        />

        <!-- window divider -->

        <path
          d="M342 80 L334 127"
          stroke="#68778a"
          stroke-width="4"
        />

        <!-- body highlight -->

        <path
          d="
          M112 171
          C190 143 313 140 464 151
          C491 153 515 163 530 177"
          fill="none"
          stroke="#9aa8b9"
          stroke-width="3"
          opacity=".45"
        />

        <!-- lower blue accent -->

        <path
          d="
          M88 208
          C190 220 413 220 538 207"
          fill="none"
          stroke="#00aaff"
          stroke-width="4"
          opacity=".7"
        />

        <!-- rear red lights -->

        <g class="carLight">

          <path
            d="M91 174 L139 168 L143 187 L96 193 Z"
            fill="url(#red)"
          />

          <path
            d="M461 169 L508 176 L523 190 L472 185 Z"
            fill="url(#red)"
          />

          <path
            d="M88 175 L42 165"
            stroke="#ff174f"
            stroke-width="9"
            opacity=".25"
            filter="url(#redGlow)"
          />

          <path
            d="M513 180 L560 172"
            stroke="#ff174f"
            stroke-width="9"
            opacity=".25"
            filter="url(#redGlow)"
          />

        </g>

        <!-- front lights -->

        <g class="carLight">

          <path
            d="M482 151 L528 164 L510 177 L472 168 Z"
            fill="url(#light)"

<div class="countdown" id="countdown">
  <div class="count-number" id="countNumber">3</div>

<!-- ================= QUIZ ================= -->

<section class="quiz" id="quiz">

  <div class="quiz-inner">

    <div class="quiz-head">

      <div class="quiz-title">
        🏁 تاقیکردنەوەی شۆفێری
      </div>

      <div class="timer" id="timer">
        40
      </div>

    </div>

    <div class="progress">
      <i id="progressBar"></i>
    </div>

    <div class="question-card">

      <div class="question" id="question">
        پرسیارەکە لێرە دەردەکەوێت...
      </div>

      <div class="options">

        <button class="option" onclick="answer(0)" id="op0">
          وەڵامی یەکەم
        </button>

        <button class="option" onclick="answer(1)" id="op1">
          وەڵامی دووەم
        </button>

        <button class="option" onclick="answer(2)" id="op2">
          وەڵامی سێیەم
        </button>

      </div>

      <button class="next" onclick="nextQuestion()">
        پرسیاری داهاتوو →
      </button>

    </div>

  </div>

</section>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://hqfvkkigcjehttciirfe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e1cjH9G8H8NLaA2t-h0_Pg_azgple4f";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   DEMO QUESTIONS
   دواتر دەتوانین هەمان questions ـی Supabase بەکاربهێنین
===================================================== */

const demoQuestions = [

  {
    question:"کاتێک چراغی سوورە، شۆفێر چی دەکات؟",
    options:[
      "دەوەستێت",
      "بە خێرایی دەڕوات",
      "دەچێتە لای چەپ"
    ],
    correct:0
  },

  {
    question:"لە کاتی باراندا شۆفێر پێویستە چی بکات؟",
    options:[
      "خێرایی زیاد بکات",
      "خێرایی کەم بکات",
      "چراغەکان دابخات"
    ],
    correct:1
  },

  {
    question:"پێش گۆڕینی ئاراستە، چی پێویستە بکەیت؟",
    options:[
      "ئاماژە بدەیت و شوێنەکە بپشکنیت",
      "خێرا بچیت",
      "بەبێ ئاگادارکردن بگۆڕیت"
    ],
    correct:0
  }

];

let questions = [...demoQuestions];

let currentQuestion = 0;
let selected = null;
let timer = 40;
let interval = null;


/* =====================================================
   START EXPERIENCE
===================================================== */

function startExperience(){

  const count = document.getElementById("countdown");
  const number = document.getElementById("countNumber");

  count.classList.add("show");

  let n = 3;

  number.textContent = n;

  const x = setInterval(()=>{

    n--;

    if(n <= 0){

      clearInterval(x);

      number.textContent = "GO!";

      setTimeout(()=>{

        count.classList.remove("show");

        document.body.classList.add("quiz-mode");

        document.getElementById("quiz")
          .scrollIntoView();

        showQuestion();

      },600);

      return;
    }

    number.textContent = n;

    number.style.animation="none";

    void number.offsetWidth;

    number.style.animation="countPop .75s ease";

  },900);

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

  const q = questions[currentQuestion];

  selected = null;

  document.getElementById("question")
    .textContent = q.question;

  for(let i=0;i<3;i++){

    const btn =
      document.getElementById("op"+i);

    btn.textContent =
      q.options[i];

    btn.classList.remove("selected");

  }

  const percent =
    (currentQuestion / questions.length) * 100;

  document.getElementById("progressBar")
    .style.width = percent+"%";

  startTimer();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

  clearInterval(interval);

  timer = 40;

  document.getElementById("timer")
    .textContent = timer;

  interval = setInterval(()=>{

    timer--;

    document.getElementById("timer")
      .textContent = timer;

    if(timer <= 0){

      clearInterval(interval);

      nextQuestion();

    }

  },1000);

}


/* =====================================================
   ANSWER
===================================================== */

function answer(index){

  selected = index;

  for(let i=0;i<3;i++){

    document
      .getElementById("op"+i)
      .classList.remove("selected");

  }

  document
    .getElementById("op"+index)
    .classList.add("selected");

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

  clearInterval(interval);

  if(currentQuestion < questions.length - 1){

    currentQuestion++;

    showQuestion();

  }else{

    finish();

  }

}


/* =====================================================
   FINISH
===================================================== */

function finish(){

  document.getElementById("question")
    .textContent =
    "🎉 تاقیکردنەوە تەواو بوو!";

  document.querySelector(".options")
    .innerHTML = `
      <div style="
        padding:25px;
        border-radius:18px;
        text-align:center;
        background:rgba(0,150,255,.08);
        border:1px solid rgba(0,150,255,.2);
        line-height:2;
      ">
        🏆<br>
        زۆر باش!
        <br>
        ئێستا دەتوانین سیستەمی
        Supabase و نمرەکانیش پەیوەست بکەین.
      </div>
    `;

  document.querySelector(".next")
    .textContent = "گەڕانەوە بۆ سەرەتا";

  document.querySelector(".next")
    .onclick = ()=>{
      location.reload();
    };

}

</script>
