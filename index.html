<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>هێزی شۆفێر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

*{box-sizing:border-box}

body{
 margin:0;
 background:#03050a;
 color:#fff;
 font-family:"Noto Sans Arabic",sans-serif
}

/* کەڤەری نوێ */
.cover{
 height:100vh;
 min-height:100vh;
 background:#03050a url("68291.png") center/cover no-repeat;
 position:relative;
}

.start{
 position:absolute;
 left:50%;
 bottom:5%;
 transform:translateX(-50%);
 width:min(430px,80vw);
 height:80px;
 border:0;
 background:transparent;
 border-radius:50px;
 cursor:pointer
}

.start:hover{
 box-shadow:0 0 35px #00eaff55
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:10;
 background:#000b;
 backdrop-filter:blur(15px);
 align-items:center;
 justify-content:center;
 padding:20px
}

.modal.show{display:flex}

.card,.sectionbox{
 width:min(900px,94%);
 background:linear-gradient(145deg,#161d2bf5,#05080efc);
 border:1px solid #00eaff33;
 border-radius:25px;
 padding:28px;
 box-shadow:0 30px 100px #000
}

.login{width:min(450px,100%)}

input{
 width:100%;
 padding:15px;
 margin:7px 0;
 border-radius:14px;
 border:1px solid #ffffff18;
 background:#ffffff0b;
 color:#fff;
 font-size:16px
}

button{font-family:inherit}

.primary,.secondary,.main{
 padding:14px;
 border-radius:14px;
 font-weight:900;
 font-size:16px;
 cursor:pointer
}

.primary{
 border:0;
 background:linear-gradient(135deg,#00eaff,#357cff);
 color:#001016
}

.secondary,.main{
 border:1px solid #ffffff18;
 background:#ffffff09;
 color:#fff
}

.row{
 display:flex;
 gap:10px;
 margin-top:12px
}

.row>*{flex:1}

.section{
 display:none;
 width:min(900px,94%);
 margin:auto;
 padding:25px 0
}

.top{
 display:flex;
 justify-content:space-between;
 gap:10px
}

.stats{
 display:flex;
 gap:7px
}

.stat{
 padding:7px 11px;
 background:#ffffff09;
 border:1px solid #ffffff12;
 border-radius:12px
}

.progress{
 height:7px;
 background:#ffffff10;
 border-radius:10px;
 margin:18px 0
}

.bar{
 height:100%;
 width:0;
 background:linear-gradient(90deg,#00eaff,#8b5cf6);
 border-radius:10px
}

.timer{
 text-align:center;
 color:#00eaff;
 font-size:19px;
 font-weight:900;
 margin:15px
}

.question{
 background:#ffffff08;
 border:1px solid #ffffff12;
 border-radius:22px;
 padding:25px
}

.option{
 width:100%;
 margin:8px 0;
 padding:16px;
 text-align:right;
 border:1px solid #ffffff12;
 background:#ffffff08;
 color:#fff;
 border-radius:14px;
 font-size:16px;
 cursor:pointer
}

.option.sel{
 border-color:#00eaff;
 background:#00eaff18
}

.next{
 width:100%;
 padding:15px;
 border:0;
 border-radius:14px;
 font-weight:900;
 margin-top:10px
}

.next:disabled{opacity:.3}

.center{text-align:center}

.muted{color:#8c98aa}

.score{
 text-align:center;
 font-size:48px;
 font-weight:900;
 color:#00eaff
}

.rowlb{
 display:flex;
 gap:12px;
 padding:14px;
 margin:8px 0;
 border-radius:14px;
 background:#ffffff08
}

.name{flex:1}

.hostrow{
 padding:14px;
 margin:8px 0;
 background:#ffffff08;
 border-radius:14px;
 line-height:2
}

.hostbtn{
 position:fixed;
 left:10px;
 bottom:10px;
 background:none;
 border:0;
 color:#fff;
 opacity:.2
}

@media(max-width:600px){
 .row{flex-direction:column}
 .cover{background-position:center}
 .start{height:65px}
}
</style>
</head>

<body>

<!-- کەڤەری سەرەتا -->
<div class="cover" id="landing">
 <button class="start" onclick="openLogin()"></button>
</div>

<!-- LOGIN -->
<div class="modal" id="login">
 <div class="card login">

  <h1 class="center">🚘 چوونەژوورەوە</h1>

  <p class="center muted">
   زانیارییەکانت بنووسە بۆ دەستپێکردنی Challenge
  </p>

  <input id="name" placeholder="👤 ناوت بنووسە">

  <input
   id="phone"
   type="tel"
   placeholder="📱 ژمارەی مۆبایلەکەت"
  >

  <div class="row">
   <button class="primary" onclick="login()">
    دەستپێکردن
   </button>

   <button class="secondary" onclick="closeLogin()">
    داخستن
   </button>
  </div>

 </div>
</div>

<!-- QUIZ -->
<section class="section" id="quiz">

 <div class="top">

  <b>
   🚘 <span style="color:#00eaff">
    هێزی شۆفێر
   </span>
  </b>

  <div class="stats">

   <div class="stat">
    ❤️ <span id="lives">3</span>
   </div>

   <div class="stat">
    🔥 <span id="combo">0</span>
   </div>

   <div class="stat">
    ⭐ <span id="xp">0</span>
   </div>

  </div>

 </div>

 <div class="progress">
  <div class="bar" id="bar"></div>
 </div>

 <div class="timer" id="timer">
  ⏱️ 40
 </div>

 <div class="question">

  <div class="muted" id="qn"></div>

  <h2 id="qt"></h2>

  <button class="option" id="o1" onclick="answer(1)"></button>
  <button class="option" id="o2" onclick="answer(2)"></button>
  <button class="option" id="o3" onclick="answer(3)"></button>

  <button
   class="next"
   id="next"
   onclick="next()"
   disabled
  >
   پرسیاری دواتر ←
  </button>

 </div>

 <button
  class="main"
  style="width:100%;margin-top:12px"
  onclick="leaderboard()"
 >
  🏆 Leaderboard
 </button>

</section>

<!-- LEADERBOARD -->
<section class="section" id="lb">

 <div class="sectionbox">

  <h1 class="center">
   🏆 Leaderboard
  </h1>

  <div id="lbList"></div>

  <button
   class="main"
   style="width:100%"
   onclick="back()"
  >
   ↩️ گەڕانەوە
  </button>

 </div>

</section>

<!-- HOST -->
<section class="section" id="host">

 <div class="sectionbox" id="hostLogin">

  <h1 class="center">
   👑 Host
  </h1>

  <input
   id="he"
   placeholder="Email"
  >

  <input
   id="hp"
   type="password"
   placeholder="Password"
  >

  <button
   class="primary"
   style="width:100%;margin-top:10px"
   onclick="hostLoginFn()"
  >
   چوونەژوورەوە
  </button>

 </div>

 <div
  class="sectionbox"
  id="hostResults"
  style="display:none"
 >

  <h1 class="center">
   👑 Host
  </h1>

  <div id="hl"></div>

  <button
   class="main"
   style="width:100%"
   onclick="hostLogout()"
  >
   چوونەدەرەوە
  </button>

 </div>

</section>

<button
 class="hostbtn"
 onclick="showHost()"
>
 👑
</button>

<script>

const URL =
"https://hqfvkkigcjehttciirfe.supabase.co";

const KEY =
"sb_publishable_e1cjH9G8H8NLaA2t-h0_Pg_azgple4f";

const sb =
supabase.createClient(URL,KEY);

let qs=[];
let i=0;
let sel=0;
let correct=0;
let name='';
let phone='';
let time=40;
let timer;
let combo=0;
let maxCombo=0;
let xp=0;
let startTime;
let results=[];

const $=x=>document.getElementById(x);


/* LOGIN */

function openLogin(){
 $('login').classList.add('show');
}

function closeLogin(){
 $('login').classList.remove('show');
}

async function login(){

 name=$('name').value.trim();
 phone=$('phone').value.trim();

 if(!name || !phone){
  return alert('تکایە ناو و ژمارەی مۆبایل بنووسە');
 }

 closeLogin();

 $('landing').style.display='none';

 await start();
}


/* START QUIZ */

async function start(){

 let r=await sb
  .from('questions')
  .select('*');

 if(r.error){
  return alert(r.error.message);
 }

 qs=r.data.sort(()=>Math.random()-.5);

 i=0;
 correct=0;
 combo=0;
 maxCombo=0;
 xp=0;
 results=[];

 $('quiz').style.display='block';

 show();
}


/* SHOW QUESTION */

function show(){

 let q=qs[i];

 sel=0;

 startTime=Date.now();

 $('qn').innerText=
 `پرسیاری ${i+1} لە ${qs.length}`;

 $('qt').innerText=
 q.question || '';

 for(let n=1;n<=3;n++){

  $('o'+n).innerText=
   n+' ـ '+(q['option'+n] || '');

 }

 for(let n=1;n<=3;n++){

  $('o'+n).classList.remove('sel');

 }

 $('next').disabled=true;

 $('bar').style.width=
  (i/qs.length*100)+'%';

 clearInterval(timer);

 time=40;

 $('timer').innerText=
  '⏱️ '+time+' چرکە';

 timer=setInterval(()=>{

  time--;

  $('timer').innerText=
   '⏱️ '+time+' چرکە';

  if(time<=0){

   clearInterval(timer);

   next();

  }

 },1000);
}


/* ANSWER */

function answer(n){

 sel=n;

 for(let x=1;x<=3;x++){

  $('o'+x).classList.remove('sel');

 }

 $('o'+n).classList.add('sel');

 $('next').disabled=false;
}


/* NEXT */

async function next(){

 clearInterval(timer);

 let q=qs[i];

 let ca=Number(q.answer);

 let ok=sel===ca;

 let t=
  Math.round((Date.now()-startTime)/1000);

 if(ok){

  correct++;

  combo++;

  maxCombo=
   Math.max(maxCombo,combo);

  xp+=10+
   Math.min(combo*2,30);

 }else{

  combo=0;

 }

 results.push({
  q,
  sel,
  ca,
  ok,
  t
 });

 i++;

 if(i>=qs.length){

  return finish();

 }

 show();
}


/* FINISH */

async function finish(){

 let total=qs.length;

 let acc=
  Math.round(correct/total*100);

 let r=await sb
  .from('leaderboard')
  .insert({
   name,
   score:correct,
   total
  })
  .select()
  .single();

 if(!r.error){

  await sb
   .from('private_results')
   .insert({
    leaderboard_id:r.data.id,
    phone
   });

 }

 let review=
  results.map((x,n)=>`

   <div class="hostrow">

    <b>
     ${n+1}. ${esc(x.q.question)}
    </b>

    <br>

    ${x.ok?'✅ ڕاست':'❌ هەڵە'}

    <br>

    وەڵامی ڕاست:
    ${esc(x.q['option'+x.ca])}

   </div>

  `).join('');

 $('quiz').innerHTML=`

  <div class="sectionbox center">

   <h1>
    🏁 کۆتایی Challenge
   </h1>

   <div class="score">
    ${acc}%
   </div>

   <h2>
    ${
     acc>=95
      ? 'LEGEND 👑'
      : acc>=85
      ? 'MASTER 🔥'
      : acc>=70
      ? 'شۆفێری شارەزا 🏎️'
      : acc>=50
      ? 'شۆفێری باش 🚗'
      : 'نوێکار 🚘'
    }
   </h2>

   <p>
    ⭐ ${xp} XP
   </p>

   <p>
    ڕاست: ${correct}
    |
    هەڵە: ${total-correct}
    |
    Max Combo: x${maxCombo}
   </p>

   <h2>
    📋 وردەکاری
   </h2>

   ${review}

   <button
    class="primary"
    style="width:100%"
    onclick="location.reload()"
   >
    🔄 دووبارە یاری کردن
   </button>

  </div>
 `;
}


/* LEADERBOARD */

async function leaderboard(){

 $('quiz').style.display='none';

 $('lb').style.display='block';

 let r=await sb
  .from('leaderboard')
  .select('name,score,total,created_at')
  .order('score',{ascending:false})
  .order('created_at',{ascending:true});

 $('lbList').innerHTML=
  r.error
   ? 'کێشەیەک ڕوویدا'
   : r.data.map((x,n)=>`

    <div class="rowlb">

     <b>
      ${
       n<3
        ? ['🥇','🥈','🥉'][n]
        : '#'+(n+1)
      }
     </b>

     <div class="name">
      👤 ${esc(x.name)}
     </div>

     <b style="color:#00eaff">
      ${x.score}/${x.total}
     </b>

    </div>

   `).join('');
}


/* BACK */

function back(){

 $('lb').style.display='none';

 $('quiz').style.display='block';
}


/* HOST */

function showHost(){

 $('landing').style.display='none';

 $('quiz').style.display='none';

 $('lb').style.display='none';

 $('host').style.display='block';
}


/* HOST LOGIN */

async function hostLoginFn(){

 let email=
  $('he').value.trim();

 let password=
  $('hp').value;

 if(!email || !password)
  return;

 let r=
  await sb.auth.signInWithPassword({
   email,
   password
  });

 if(r.error)
  return alert(
   'چوونەژوورەوە سەرکەوتوو نەبوو'
  );

 let h=
  await sb
   .from('hosts')
   .select('user_id')
   .eq('user_id',r.data.user.id)
   .maybeSingle();

 if(!h.data){

  await sb.auth.signOut();

  return alert(
   'ئەم ئەکاونتە Host نییە'
  );
 }

 $('hostLogin').style.display='none';

 $('hostResults').style.display='block';

 let d=
  await sb
   .from('private_results')
   .select(
    'phone,created_at,leaderboard(name,score,total)'
   )
   .order('created_at',{ascending:false});

 $('hl').innerHTML=
  d.data?.map((x,n)=>`

   <div class="hostrow">

    #${n+1}

    <br>

    👤 ${esc(x.leaderboard.name)}

    <br>

    📱 ${esc(x.phone)}

    <br>

    🏆
    ${x.leaderboard.score}/${x.leaderboard.total}

   </div>

  `).join('')
  ||
  'هیچ ئەنجامێک نییە';
}


/* HOST LOGOUT */

async function hostLogout(){

 await sb.auth.signOut();

 location.reload();
}


/* ESCAPE HTML */

function esc(v){

 return String(v)
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}

</script>

</body>
</html>
