<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تاقیکردنەوەی شۆفێری</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

#coverImage {
    width: 100%;
    display: block;
}

.login-button {
    position: absolute;
    top: 78%;
    left: 70%;
    transform: translate(-50%, -50%);

    font-size: 28px;
    padding: 15px 45px;

    cursor: pointer;

    border: none;
    border-radius: 10px;

    background: white;
}

.login-box {
    display: none;

    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    background: white;

    padding: 30px;

    width: 350px;
    max-width: 80%;

    border-radius: 15px;

    box-shadow: 0 0 25px #555;

    text-align: center;

    z-index: 10;
}

.login-box h2 {
    font-size: 30px;
    margin-bottom: 25px;
}

.login-box input {
    width: 90%;
    box-sizing: border-box;

    padding: 14px;
    margin: 8px;

    font-size: 18px;

    border: 1px solid #ccc;
    border-radius: 8px;
}

.login-box button {
    padding: 13px 25px;

    font-size: 18px;

    margin-top: 15px;

    cursor: pointer;

    border: none;
    border-radius: 8px;
}

.quiz {
    display: none;

    padding: 25px;

    max-width: 700px;

    margin: auto;
}

.quiz-title {
    text-align: center;
    margin-bottom: 20px;
}

.quiz-image {
    width: 100%;

    max-height: 450px;

    object-fit: contain;

    display: block;

    margin: 0 auto 20px auto;

    border-radius: 15px;
}

.timer {
    text-align: center;

    font-size: 30px;

    font-weight: bold;

    background: white;

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 12px;

    box-shadow: 0 2px 10px #ccc;
}

.question-box {
    background: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow: 0 2px 10px #ccc;
}

.question-number {
    font-size: 18px;
    color: #777;
}

#questionText {
    font-size: 25px;
    line-height: 1.7;
}

.option {
    width: 100%;

    padding: 16px;

    margin: 10px 0;

    font-size: 20px;

    border: 1px solid #ccc;

    border-radius: 10px;

    background: white;

    cursor: pointer;

    text-align: right;
}

.option:hover {
    background: #eee;
}

#nextButton {
    width: 100%;

    padding: 15px;

    font-size: 20px;

    border: none;

    border-radius: 10px;

    margin-top: 15px;

    cursor: pointer;

    background: #222;

    color: white;
}

#nextButton:disabled {
    opacity: 0.5;

    cursor: not-allowed;
}

.result {
    background: white;

    padding: 30px;

    border-radius: 15px;

    text-align: center;

    box-shadow: 0 2px 10px #ccc;
}

.result-title {
    margin-bottom: 20px;
}

.score {
    font-size: 30px;
    font-weight: bold;

    margin: 20px 0;
}

.review {
    text-align: right;

    margin-top: 30px;
}

.review-item {
    background: #f5f5f5;

    padding: 18px;

    margin: 15px 0;

    border-radius: 12px;

    border-right: 6px solid #777;
}

.review-correct {
    border-right-color: green;
}

.review-wrong {
    border-right-color: red;
}

.review-question {
    font-size: 20px;

    font-weight: bold;

    margin-bottom: 12px;
}

.correct-text {
    color: green;

    font-weight: bold;
}

.wrong-text {
    color: red;

    font-weight: bold;
}

.correct-answer {
    margin-top: 10px;

    color: green;

    font-weight: bold;
}

.restart-button {
    width: 100%;

    padding: 15px;

    margin-top: 20px;

    font-size: 20px;

    background: #222;

    color: white;

    border: none;

    border-radius: 10px;

    cursor: pointer;
}

</style>

</head>

<body>


<img
    id="coverImage"
    src="cover.jpg"
    alt="وێنەی سەرەکی"
>


<button
    class="login-button"
    id="loginButton"
    onclick="openLogin()"
>
    چوونەژوورەوە
</button>


<div
    class="login-box"
    id="loginBox"
>

    <h2>
        چوونەژوورەوە
    </h2>

    <input
        type="text"
        id="name"
        placeholder="ناوت بنووسە"
    >

    <input
        type="tel"
        id="phone"
        placeholder="ژمارەی مۆبایلەکەت"
    >

    <br>

    <button onclick="login()">
        چوونەژوورەوە
    </button>

    <button onclick="closeLogin()">
        داخستن
    </button>

</div>


<div
    class="quiz"
    id="quiz"
>

    <h1 class="quiz-title">
        🚦 تاقیکردنەوەی شۆفێری
    </h1>


    <img
        id="quizImage"
        class="quiz-image"
        src="sign.jpg"
        alt="وێنەی ناوەوە"
    >


    <div
        id="timer"
        class="timer"
    >
        ⏱️ 40 چرکە
    </div>


    <div class="question-box">

        <div
            class="question-number"
            id="questionNumber"
        ></div>


        <h2 id="questionText"></h2>


        <button
            class="option"
            id="option1"
            onclick="chooseAnswer(1)"
        ></button>


        <button
            class="option"
            id="option2"
            onclick="chooseAnswer(2)"
        ></button>


        <button
            class="option"
            id="option3"
            onclick="chooseAnswer(3)"
        ></button>


        <button
            id="nextButton"
            onclick="nextQuestion()"
            disabled
        >
            پرسیاری دواتر
        </button>

    </div>

</div>


<script>


const SUPABASE_URL =
"https://hqfvkkigcjehttciirfe.supabase.co";


const SUPABASE_KEY =
"sb_publishable_e1cjH9G8H8NLaA2t-h0_Pg_azgple4f";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let questions = [];

let currentQuestion = 0;

let selectedAnswer = null;

let correctAnswers = 0;

let userName = "";

let userPhone = "";

let timeLeft = 40;

let timerInterval = null;


/*
    ئەم لیستە وەڵامی بەکارهێنەرانی تێدا هەڵدەگرێت
*/

let userResults = [];


function openLogin() {

    document.getElementById(
        "loginBox"
    ).style.display = "block";

}


function closeLogin() {

    document.getElementById(
        "loginBox"
    ).style.display = "none";

}


async function login() {

    userName =
        document.getElementById(
            "name"
        ).value.trim();


    userPhone =
        document.getElementById(
            "phone"
        ).value.trim();


    if (
        userName === "" ||
        userPhone === ""
    ) {

        alert(
            "تکایە ناو و ژمارەی مۆبایل بنووسە"
        );

        return;
    }


    document.getElementById(
        "coverImage"
    ).style.display = "none";


    document.getElementById(
        "loginButton"
    ).style.display = "none";


    document.getElementById(
        "loginBox"
    ).style.display = "none";


    await startQuiz();

}


async function startQuiz() {


    const {
        data,
        error
    } = await supabaseClient

        .from("questions")

        .select("*");


    if (error) {

        console.log(error);

        alert(
            "کێشەیەک ڕوویدا لە وەرگرتنی پرسیارەکان.\n\n" +
            error.message
        );

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        alert(
            "هیچ پرسیارێک لە Supabase نییە."
        );

        return;
    }


    questions =
        data.sort(
            () => Math.random() - 0.5
        );


    currentQuestion = 0;

    correctAnswers = 0;

    userResults = [];


    document.getElementById(
        "quiz"
    ).style.display = "block";


    showQuestion();

}


function showQuestion() {


    const q =
        questions[currentQuestion];


    selectedAnswer = null;


    document.getElementById(
        "questionNumber"
    ).innerText =

        "پرسیاری " +
        (currentQuestion + 1) +
        " لە " +
        questions.length;


    document.getElementById(
        "questionText"
    ).innerText =

        q.question || "پرسیار بەتاڵە";


    document.getElementById(
        "option1"
    ).innerText =

        "1 ـ " +
        (q.option1 || "بەتاڵە");


    document.getElementById(
        "option2"
    ).innerText =

        "2 ـ " +
        (q.option2 || "بەتاڵە");


    document.getElementById(
        "option3"
    ).innerText =

        "3 ـ " +
        (q.option3 || "بەتاڵە");


    document.getElementById(
        "option1"
    ).style.background = "white";


    document.getElementById(
        "option2"
    ).style.background = "white";


    document.getElementById(
        "option3"
    ).style.background = "white";


    document.getElementById(
        "nextButton"
    ).disabled = true;


    startTimer();

}


function startTimer() {


    clearInterval(timerInterval);


    timeLeft = 40;


    updateTimer();


    timerInterval = setInterval(
        function() {


            timeLeft--;


            updateTimer();


            if (
                timeLeft <= 0
            ) {


                clearInterval(
                    timerInterval
                );


                if (
                    selectedAnswer === null
                ) {

                    selectedAnswer = 0;

                }


                nextQuestion();

            }


        },
        1000
    );

}


function updateTimer() {


    document.getElementById(
        "timer"
    ).innerText =

        "⏱️ " +
        timeLeft +
        " چرکە";

}


function chooseAnswer(number) {


    selectedAnswer = number;


    document.getElementById(
        "option1"
    ).style.background = "white";


    document.getElementById(
        "option2"
    ).style.background = "white";


    document.getElementById(
        "option3"
    ).style.background = "white";


    document.getElementById(
        "option" + number
    ).style.background = "#ddd";


    document.getElementById(
        "nextButton"
    ).disabled = false;

}


function nextQuestion() {


    clearInterval(
        timerInterval
    );


    if (
        selectedAnswer === null
    ) {

        selectedAnswer = 0;

    }


    const q =
        questions[currentQuestion];


    const correctAnswer =
        Number(q.answer);


    const isCorrect =
        Number(selectedAnswer) ===
        correctAnswer;


    if (isCorrect) {

        correctAnswers++;

    }


    /*
        ئەنجامی ئەم پرسیارە هەڵدەگرین
    */

    userResults.push({

        question:
            q.question || "",

        selectedAnswer:
            Number(selectedAnswer),

        correctAnswer:
            correctAnswer,

        option1:
            q.option1 || "",

        option2:
            q.option2 || "",

        option3:
            q.option3 || "",

        isCorrect:
            isCorrect

    });


    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        finishQuiz();

        return;

    }


    showQuestion();

}


function finishQuiz() {


    clearInterval(
        timerInterval
    );


    const total =
        questions.length;


    const wrongAnswers =
        total - correctAnswers;


    let reviewHTML = "";


    userResults.forEach(
        function(result, index) {


            let selectedText =
                "وەڵام نەدراوە";


            if (
                result.selectedAnswer === 1
            ) {

                selectedText =
                    "1 ـ " +
                    result.option1;

            }


            if (
                result.selectedAnswer === 2
            ) {

                selectedText =
                    "2 ـ " +
                    result.option2;

            }


            if (
                result.selectedAnswer === 3
            ) {

                selectedText =
                    "3 ـ " +
                    result.option3;

            }


            let correctText = "";


            if (
                result.correctAnswer === 1
            ) {

                correctText =
                    "1 ـ " +
                    result.option1;

            }


            if (
                result.correctAnswer === 2
            ) {

                correctText =
                    "2 ـ " +
                    result.option2;

            }


            if (
                result.correctAnswer === 3
            ) {

                correctText =
                    "3 ـ " +
                    result.option3;

            }


            if (
                result.isCorrect
            ) {


                reviewHTML += `

                    <div class="review-item review-correct">

                        <div class="review-question">

                            ${index + 1}.
                            ${result.question}

                        </div>

                        <div class="correct-text">

                            ✅ وەڵامت ڕاستە

                        </div>

                        <div>

                            وەڵامی تۆ:
                            ${selectedText}

                        </div>

                    </div>

                `;


            } else {


                reviewHTML += `

                    <div class="review-item review-wrong">

                        <div class="review-question">

                            ${index + 1}.
                            ${result.question}

                        </div>

                        <div class="wrong-text">

                            ❌ وەڵامت هەڵەیە

                        </div>

                        <div>

                            وەڵامی تۆ:
                            ${selectedText}

                        </div>

                        <div class="correct-answer">

                            ✅ وەڵامی ڕاست:
                            ${correctText}

                        </div>

                    </div>

                `;

            }


        }
    );


    document.getElementById(
        "quiz"
    ).innerHTML = `

        <div class="result">

            <h1 class="result-title">

                🎉 تاقیکردنەوەکە تەواو بوو

            </h1>


            <h2>

                بەخێربێیت
                ${userName}
                🌹

            </h2>


            <div class="score">

                نمرە:
                ${correctAnswers}
                /
                ${total}

            </div>


            <p>

                کۆی پرسیارەکان:
                <strong>
                    ${total}
                </strong>

            </p>


            <p>

                وەڵامی ڕاست:
                <strong>
                    ${correctAnswers}
                </strong>

            </p>


            <p>

                وەڵامی هەڵە:
                <strong>
                    ${wrongAnswers}
                </strong>

            </p>


            <div class="review">

                <h2>

                    📋 وردەکاری وەڵامەکان

                </h2>

                ${reviewHTML}

            </div>


            <button
                class="restart-button"
                onclick="location.reload()"
            >

                🔄 دووبارە دەستپێکردنەوە

            </button>


        </div>

    `;

}


</script>

</body>

</html>
