<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هێزی شۆفێر | تاقیکردنەوەی شۆفێری</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   NIGHT DRIVE DESIGN
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 20% 20%, rgba(94,53,177,.20), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(0,188,212,.16), transparent 35%),
        #070912;
    overflow-x: hidden;
}

/* Animated background */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .16;
    pointer-events: none;
    z-index: -2;
    animation: floatingLight 12s ease-in-out infinite alternate;
}

body::before {
    background: #7c4dff;
    top: -180px;
    left: -180px;
}

body::after {
    background: #00e5ff;
    bottom: -180px;
    right: -180px;
    animation-delay: -5s;
}

@keyframes floatingLight {
    0% {
        transform: translate(0,0) scale(1);
    }
    50% {
        transform: translate(80px,50px) scale(1.15);
    }
    100% {
        transform: translate(-30px,90px) scale(.9);
    }
}

/* Moving road lines */

.road-lines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
    opacity: .18;
}

.road-line {
    position: absolute;
    width: 2px;
    height: 120px;
    background: linear-gradient(
        transparent,
        #00e5ff,
        transparent
    );
    animation: roadMove 5s linear infinite;
}

.road-line:nth-child(1) {
    left: 15%;
    animation-delay: 0s;
}

.road-line:nth-child(2) {
    left: 35%;
    animation-delay: 1.5s;
}

.road-line:nth-child(3) {
    left: 55%;
    animation-delay: 3s;
}

.road-line:nth-child(4) {
    left: 75%;
    animation-delay: 4s;
}

.road-line:nth-child(5) {
    left: 90%;
    animation-delay: 2s;
}

@keyframes roadMove {
    from {
        top: -150px;
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    to {
        top: 110vh;
        opacity: 0;
    }
}

/* Particles */

.particle {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #00e5ff;
    box-shadow: 0 0 12px #00e5ff;
    opacity: .5;
    pointer-events: none;
    z-index: -1;
    animation: particleFloat 8s linear infinite;
}

@keyframes particleFloat {
    from {
        transform: translateY(110vh) translateX(0);
        opacity: 0;
    }

    20% {
        opacity: .7;
    }

    80% {
        opacity: .4;
    }

    to {
        transform: translateY(-10vh) translateX(80px);
        opacity: 0;
    }
}

/* =========================================================
   COVER
========================================================= */

#coverImage {
    width: 100%;
    min-height: 100vh;
    object-fit: cover;
    display: block;
    filter: brightness(.42) saturate(1.15);
    animation: coverZoom 12s ease-in-out infinite alternate;
}

@keyframes coverZoom {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.05);
    }
}

/* Dark overlay */

body:has(#coverImage[style*="none"]) {
    background: #070912;
}

/* =========================================================
   BRAND
========================================================= */

.brand {
    position: fixed;
    top: 25px;
    right: 30px;
    z-index: 20;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #fff;
    text-shadow:
        0 0 10px rgba(0,229,255,.8),
        0 0 25px rgba(124,77,255,.7);
    animation: brandGlow 3s ease-in-out infinite alternate;
}

.brand span {
    color: #00e5ff;
}

@keyframes brandGlow {
    from {
        text-shadow:
            0 0 8px rgba(0,229,255,.4);
    }

    to {
        text-shadow:
            0 0 12px #00e5ff,
            0 0 35px #7c4dff;
    }
}

/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-button {
    position: absolute;
    top: 78%;
    left: 70%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: bold;
    padding: 17px 48px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 18px;
    color: white;
    background:
        linear-gradient(
            135deg,
            rgba(124,77,255,.85),
            rgba(0,188,212,.75)
        );
    box-shadow:
        0 0 20px rgba(0,229,255,.25),
        inset 0 0 20px rgba(255,255,255,.08);
    backdrop-filter: blur(12px);
    transition: .3s;
    animation: buttonPulse 2.5s ease-in-out infinite;
}

.login-button:hover {
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow:
        0 0 25px #00e5ff,
        0 0 55px rgba(124,77,255,.5);
}

@keyframes buttonPulse {
    0%,100% {
        box-shadow:
            0 0 15px rgba(0,229,255,.2);
    }

    50% {
        box-shadow:
            0 0 28px rgba(0,229,255,.55),
            0 0 55px rgba(124,77,255,.25);
    }
}

/* =========================================================
   GLASS LOGIN
========================================================= */

.login-box {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background:
        linear-gradient(
            145deg,
            rgba(25,28,50,.92),
            rgba(8,10,22,.94)
        );
    padding: 32px;
    width: 380px;
    max-width: 88%;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.13);
    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 40px rgba(124,77,255,.18);
    backdrop-filter: blur(25px);
    text-align: center;
    z-index: 100;
    animation: modalIn .45s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translate(-50%, -45%) scale(.9);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

.login-box h2 {
    font-size: 30px;
    margin: 5px 0 25px;
    background: linear-gradient(90deg,#00e5ff,#b388ff);
    -webkit-background-clip: text;
    color: transparent;
}

.login-box input,
.host-login input {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    font-size: 17px;
    color: white;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 13px;
    outline: none;
    transition: .25s;
    direction: rtl;
}

.login-box input:focus,
.host-login input:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 18px rgba(0,229,255,.2);
    background: rgba(0,229,255,.05);
}

.login-box button,
.host-login button {
    padding: 13px 25px;
    font-size: 17px;
    margin: 8px 4px 0;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    color: white;
    background: linear-gradient(
        135deg,
        #7c4dff,
        #00acc1
    );
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
    transition: .25s;
}

.login-box button:hover,
.host-login button:hover {
    transform: translateY(-3px);
    box-shadow:
        0 8px 30px rgba(0,229,255,.25);
}

/* =========================================================
   QUIZ
========================================================= */

.quiz {
    display: none;
    padding: 35px 20px;
    max-width: 760px;
    margin: auto;
    animation: pageIn .5s ease;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.quiz-title {
    text-align: center;
    margin-bottom: 25px;
    font-size: 32px;
    background: linear-gradient(
        90deg,
        #00e5ff,
        #7c4dff,
        #ff4081
    );
    -webkit-background-clip: text;
    color: transparent;
    background-size: 200% auto;
    animation: gradientText 4s linear infinite;
}

@keyframes gradientText {
    to {
        background-position: 200% center;
    }
}

.quiz-image {
    width: 100%;
    max-height: 430px;
    object-fit: contain;
    display: block;
    margin: 0 auto 22px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    box-shadow:
        0 20px 50px rgba(0,0,0,.4),
        0 0 30px rgba(0,229,255,.08);
    padding: 8px;
}

/* =========================================================
   TIMER
========================================================= */

.timer {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #00e5ff;
    background:
        linear-gradient(
            145deg,
            rgba(20,25,45,.9),
            rgba(8,10,20,.9)
        );
    padding: 15px;
    margin-bottom: 18px;
    border-radius: 17px;
    border: 1px solid rgba(0,229,255,.16);
    box-shadow:
        0 0 25px rgba(0,229,255,.08);
    transition: .3s;
}

.timer.warning {
    color: #ff5252;
    border-color: rgba(255,82,82,.45);
    box-shadow:
        0 0 25px rgba(255,82,82,.25);
    animation: timerWarning .7s infinite alternate;
}

@keyframes timerWarning {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.025);
    }
}

/* =========================================================
   QUESTION CARD
========================================================= */

.question-box {
    background:
        linear-gradient(
            145deg,
            rgba(27,31,53,.88),
            rgba(11,14,28,.94)
        );
    padding: 28px;
    border-radius: 23px;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter: blur(18px);
    animation: questionIn .45s ease;
}

@keyframes questionIn {
    from {
        opacity: 0;
        transform: translateX(25px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.question-number {
    display: inline-block;
    font-size: 16px;
    color: #00e5ff;
    background: rgba(0,229,255,.08);
    padding: 8px 13px;
    border-radius: 10px;
    margin-bottom: 10px;
}

#questionText {
    font-size: 24px;
    line-height: 1.8;
    margin-top: 8px;
}

/* =========================================================
   OPTIONS
========================================================= */

.option {
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 17px;
    margin: 10px 0;
    font-size: 19px;
    font-weight: bold;
    color: #f5f5f5;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 14px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );
    cursor: pointer;
    text-align: right;
    transition:
        transform .25s,
        background .25s,
        border .25s,
        box-shadow .25s;
}

.option::before {
    content: "";
    position: absolute;
    top: 0;
    right: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,229,255,.13),
        transparent
    );
    transition: .6s;
}

.option:hover {
    transform: translateX(-5px);
    border-color: rgba(0,229,255,.45);
    box-shadow:
        0 0 20px rgba(0,229,255,.08);
}

.option:hover::before {
    right: 100%;
}

.option.selected {
    background:
        linear-gradient(
            135deg,
            rgba(124,77,255,.38),
            rgba(0,229,255,.18)
        ) !important;
    border-color: #00e5ff;
    box-shadow:
        0 0 25px rgba(0,229,255,.16);
    transform: scale(1.015);
}

/* =========================================================
   NEXT BUTTON
========================================================= */

#nextButton {
    width: 100%;
    padding: 16px;
    font-size: 19px;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    margin-top: 15px;
    cursor: pointer;
    background:
        linear-gradient(
            135deg,
            #7c4dff,
            #00acc1
        );
    color: white;
    box-shadow:
        0 10px 30px rgba(0,0,0,.3);
    transition: .25s;
}

#nextButton:not(:disabled):hover {
    transform: translateY(-3px);
    box-shadow:
        0 12px 35px rgba(0,229,255,.22);
}

#nextButton:disabled {
    opacity: .3;
    cursor: not-allowed;
}

/* =========================================================
   MAIN BUTTON
========================================================= */

.main-button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    cursor: pointer;
    background:
        linear-gradient(
            135deg,
            rgba(124,77,255,.8),
            rgba(0,172,193,.8)
        );
    color: white;
    transition: .25s;
}

.main-button:hover {
    transform: translateY(-3px);
    box-shadow:
        0 12px 35px rgba(0,229,255,.18);
}

/* =========================================================
   RESULT
========================================================= */

.result {
    background:
        linear-gradient(
            145deg,
            rgba(27,31,53,.92),
            rgba(8,11,23,.95)
        );
    padding: 30px;
    border-radius: 24px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
    animation: resultIn .7s ease;
}

@keyframes resultIn {
    from {
        opacity: 0;
        transform: scale(.9) translateY(30px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.result-title {
    margin-bottom: 20px;
    color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,.35);
}

.score {
    font-size: 40px;
    font-weight: bold;
    margin: 25px 0;
    background: linear-gradient(
        90deg,
        #00e5ff,
        #b388ff,
        #ff4081
    );
    -webkit-background-clip: text;
    color: transparent;
    animation: scoreGlow 2s infinite alternate;
}

@keyframes scoreGlow {
    from {
        filter: drop-shadow(0 0 2px rgba(0,229,255,.2));
    }

    to {
        filter: drop-shadow(0 0 15px rgba(124,77,255,.6));
    }
}

/* =========================================================
   REVIEW
========================================================= */

.review {
    text-align: right;
    margin-top: 30px;
}

.review-item {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.05),
            rgba(255,255,255,.025)
        );
    padding: 18px;
    margin: 15px 0;
    border-radius: 15px;
    border-right: 5px solid #777;
    transition: .25s;
}

.review-item:hover {
    transform: translateX(-4px);
}

.review-correct {
    border-right-color: #00e676;
    box-shadow: inset -15px 0 25px rgba(0,230,118,.04);
}

.review-wrong {
    border-right-color: #ff5252;
    box-shadow: inset -15px 0 25px rgba(255,82,82,.04);
}

.review-question {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.7;
    margin-bottom: 12px;
}

.correct-text {
    color: #00e676;
    font-weight: bold;
}

.wrong-text {
    color: #ff5252;
    font-weight: bold;
}

.correct-answer {
    margin-top: 10px;
    color: #00e676;
    font-weight: bold;
}

/* =========================================================
   LEADERBOARD
========================================================= */

.leaderboard {
    display: none;
    padding: 35px 20px;
    max-width: 760px;
    margin: auto;
    animation: pageIn .5s ease;
}

.leaderboard-box {
    background:
        linear-gradient(
            145deg,
            rgba(27,31,53,.92),
            rgba(8,11,23,.95)
        );
    padding: 28px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
}

.leaderboard-box h1 {
    color: #ffd740;
    text-shadow: 0 0 20px rgba(255,215,64,.3);
}

.leaderboard-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );
    border: 1px solid rgba(255,255,255,.07);
    padding: 16px;
    margin: 10px 0;
    border-radius: 14px;
    font-size: 18px;
    transition: .25s;
    animation: rowIn .4s ease both;
}

.leaderboard-row:hover {
    transform: translateX(-5px);
    border-color: rgba(0,229,255,.3);
    box-shadow: 0 0 20px rgba(0,229,255,.06);
}

@keyframes rowIn {
    from {
        opacity: 0;
        transform: translateX(20px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.rank {
    font-weight: bold;
    min-width: 50px;
    color: #ffd740;
}

/* =========================================================
   HOST
========================================================= */

.host-box {
    display: none;
    padding: 35px 20px;
    max-width: 850px;
    margin: auto;
    animation: pageIn .5s ease;
}

.host-login,
.host-results {
    background:
        linear-gradient(
            145deg,
            rgba(27,31,53,.94),
            rgba(8,11,23,.96)
        );
    padding: 28px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
    text-align: center;
}

.host-login h1,
.host-results h1 {
    color: #ffd740;
    text-shadow: 0 0 20px rgba(255,215,64,.25);
}

.host-row {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );
    border: 1px solid rgba(255,255,255,.08);
    padding: 18px;
    margin: 10px 0;
    border-radius: 14px;
    font-size: 18px;
    text-align: right;
    transition: .25s;
}

.host-row:hover {
    border-color: rgba(255,215,64,.3);
    transform: translateX(-4px);
}

/* =========================================================
   HOST BUTTON
========================================================= */

#hostButton {
    position: fixed !important;
    bottom: 12px !important;
    left: 12px !important;
    opacity: .18 !important;
    border: none !important;
    background: transparent !important;
    color: white !important;
    cursor: pointer !important;
    font-size: 20px !important;
    transition: .3s !important;
    z-index: 50;
}

#hostButton:hover {
    opacity: 1 !important;
    transform: scale(1.15);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .brand {
        top: 15px;
        right: 18px;
        font-size: 19px;
    }

    .login-button {
        left: 50%;
        top: 82%;
        font-size: 20px;
        padding: 15px 35px;
    }

    .quiz,
    .leaderboard,
    .host-box {
        padding: 22px 13px;
    }

    .quiz-title {
        font-size: 26px;
    }

    .question-box {
        padding: 20px 15px;
    }

    #questionText {
        font-size: 21px;
    }

    .option {
        font-size: 17px;
        padding: 15px;
    }

    .timer {
        font-size: 24px;
    }

    .result {
        padding: 22px 15px;
    }

    .score {
        font-size: 34px;
    }

    .leaderboard-box,
    .host-login,
    .host-results {
        padding: 20px 15px;
    }

}

/* =========================================================
   SELECTION
========================================================= */

::selection {
    background: #7c4dff;
    color: white;
}

</style>

</head>

<body>

<!-- Animated background -->

<div class="road-lines">
    <div class="road-line"></div>
    <div class="road-line"></div>
    <div class="road-line"></div>
    <div class="road-line"></div>
    <div class="road-line"></div>
</div>

<div id="particles"></div>

<div class="brand">
    🚘 <span>هێزی شۆفێر</span>
</div>

<img
    id="coverImage"
    src="cover.jpg"
    alt="وێنەی سەرەکی"
>

<button
    class="login-button"
    id="loginButton"
    onclick="openLogin()"
>
    🚦 دەستپێکردن
</button>


<!-- LOGIN -->

<div class="login-box" id="loginBox">

    <h2>🚘 هێزی شۆفێر</h2>

    <p style="color:#aaa;">
        بۆ دەستپێکردنی تاقیکردنەوەکە زانیارییەکانت بنووسە
    </p>

    <input
        type="text"
        id="name"
        placeholder="ناوت بنووسە"
    >

    <input
        type="tel"
        id="phone"
        placeholder="ژمارەی مۆبایلەکەت"
    >

    <button onclick="login()">
        🚀 دەستپێکردن
    </button>

    <button onclick="closeLogin()">
        داخستن
    </button>

</div>


<!-- QUIZ -->

<div class="quiz" id="quiz">

    <h1 class="quiz-title">
        🚦 تاقیکردنەوەی شۆفێری
    </h1>

    <img
        id="quizImage"
        class="quiz-image"
        src="sign.jpg"
        alt="وێنەی ناوەوە"
    >

    <div id="timer" class="timer">
        ⏱️ 40 چرکە
    </div>

    <div class="question-box">

        <div
            class="question-number"
            id="questionNumber"
        ></div>

        <h2 id="questionText"></h2>

        <button
            class="option"
            id="option1"
            onclick="chooseAnswer(1)"
        ></button>

        <button
            class="option"
            id="option2"
            onclick="chooseAnswer(2)"
        ></button>

        <button
            class="option"
            id="option3"
            onclick="chooseAnswer(3)"
        ></button>

        <button
            id="nextButton"
            onclick="nextQuestion()"
            disabled
        >
            پرسیاری دواتر ➜
        </button>

    </div>

    <button
        class="main-button"
        onclick="showLeaderboard()"
    >
        🏆 Leaderboard
    </button>

</div>


<!-- LEADERBOARD -->

<div class="leaderboard" id="leaderboard">

    <div class="leaderboard-box">

        <h1 style="text-align:center;">
            🏆 Leaderboard
        </h1>

        <p style="text-align:center;color:#aaa;">
            باشترین ئەنجامەکان
        </p>

        <div id="leaderboardList">
            چاوەڕێ بە...
        </div>

        <button
            class="main-button"
            onclick="backToQuiz()"
        >
            ↩️ گەڕانەوە
        </button>

    </div>

</div>


<!-- HOST -->

<div class="host-box" id="hostBox">

    <div class="host-login" id="hostLoginBox">

        <h1>👑 Host</h1>

        <p style="color:#aaa;">
            تەنیا Host دەتوانێت ژمارە مۆبایلەکان ببینێت.
        </p>

        <input
            type="email"
            id="hostEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="hostPassword"
            placeholder="Password"
        >

        <button
            class="main-button"
            onclick="hostLogin()"
        >
            🔐 چوونەژوورەوەی Host
        </button>

        <button
            class="main-button"
            onclick="hideHost()"
        >
            داخستن
        </button>

    </div>

    <div
        class="host-results"
        id="hostResults"
        style="display:none;"
    >

        <h1 style="text-align:center;">
            👑 بەشی Host
        </h1>

        <div id="hostList">
            چاوەڕێ بە...
        </div>

        <button
            class="main-button"
            onclick="hostLogout()"
        >
            چوونەدەرەوە
        </button>

    </div>

</div>


<button
    id="hostButton"
    onclick="showHost()"
>
    👑
</button>


<script>

/* =========================================================
   PARTICLES
========================================================= */

const particleContainer =
    document.getElementById("particles");

for (let i = 0; i < 35; i++) {

    const particle =
        document.createElement("div");

    particle.className = "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDelay =
        Math.random() * 8 + "s";

    particle.style.animationDuration =
        (5 + Math.random() * 7) + "s";

    particle.style.opacity =
        0.2 + Math.random() * 0.6;

    particleContainer.appendChild(
        particle
    );

}


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://hqfvkkigcjehttciirfe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_e1cjH9G8H8NLaA2t-h0_Pg_azgple4f";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   VARIABLES
========================================================= */

let questions = [];
let currentQuestion = 0;
let selectedAnswer = null;
let correctAnswers = 0;
let userName = "";
let userPhone = "";
let timeLeft = 40;
let timerInterval = null;
let userResults = [];


/* =========================================================
   LOGIN
========================================================= */

function openLogin() {

    document.getElementById(
        "loginBox"
    ).style.display = "block";

}

function closeLogin() {

    document.getElementById(
        "loginBox"
    ).style.display = "none";

}


async function login() {

    userName =
        document.getElementById(
            "name"
        ).value.trim();

    userPhone =
        document.getElementById(
            "phone"
        ).value.trim();

    if (
        userName === "" ||
        userPhone === ""
    ) {

        alert(
            "تکایە ناو و ژمارەی مۆبایل بنووسە"
        );

        return;
    }

    document.getElementById(
        "coverImage"
    ).style.display = "none";

    document.getElementById(
        "loginButton"
    ).style.display = "none";

    document.getElementById(
        "loginBox"
    ).style.display = "none";

    await startQuiz();

}


/* =========================================================
   START QUIZ
========================================================= */

async function startQuiz() {

    const {
        data,
        error
    } = await supabaseClient
        .from("questions")
        .select("*");

    if (error) {

        console.log(error);

        alert(
            "کێشەیەک ڕوویدا لە وەرگرتنی پرسیارەکان.\n\n" +
            error.message
        );

        return;
    }

    if (
        !data ||
        data.length === 0
    ) {

        alert(
            "هیچ پرسیارێک لە Supabase نییە."
        );

        return;
    }

    questions =
        data.sort(
            () => Math.random() - 0.5
        );

    currentQuestion = 0;
    correctAnswers = 0;
    userResults = [];

    document.getElementById(
        "quiz"
    ).style.display = "block";

    showQuestion();

}


/* =========================================================
   QUESTIONS
========================================================= */

function showQuestion() {

    const q =
        questions[currentQuestion];

    selectedAnswer = null;

    const questionBox =
        document.querySelector(
            ".question-box"
        );

    questionBox.style.animation =
        "none";

    void questionBox.offsetWidth;

    questionBox.style.animation =
        "questionIn .45s ease";

    document.getElementById(
        "questionNumber"
    ).innerText =
        "پرسیاری " +
        (currentQuestion + 1) +
        " لە " +
        questions.length;

    document.getElementById(
        "questionText"
    ).innerText =
        q.question || "پرسیار بەتاڵە";

    document.getElementById(
        "option1"
    ).innerText =
        "1 ـ " +
        (q.option1 || "بەتاڵە");

    document.getElementById(
        "option2"
    ).innerText =
        "2 ـ " +
        (q.option2 || "بەتاڵە");

    document.getElementById(
        "option3"
    ).innerText =
        "3 ـ " +
        (q.option3 || "بەتاڵە");

    document.getElementById(
        "option1"
    ).classList.remove("selected");

    document.getElementById(
        "option2"
    ).classList.remove("selected");

    document.getElementById(
        "option3"
    ).classList.remove("selected");

    document.getElementById(
        "nextButton"
    ).disabled = true;

    startTimer();

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    clearInterval(timerInterval);

    timeLeft = 40;

    updateTimer();

    timerInterval =
        setInterval(
            function() {

                timeLeft--;

                updateTimer();

                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );

                    if (
                        selectedAnswer === null
                    ) {

                        selectedAnswer = 0;

                    }

                    nextQuestion();

                }

            },
            1000
        );

}


function updateTimer() {

    const timer =
        document.getElementById(
            "timer"
        );

    timer.innerText =
        "⏱️ " +
        timeLeft +
        " چرکە";

    if (
        timeLeft <= 10
    ) {

        timer.classList.add(
            "warning"
        );

    } else {

        timer.classList.remove(
            "warning"
        );

    }

}


/* =========================================================
   ANSWER
========================================================= */

function chooseAnswer(number) {

    selectedAnswer = number;

    document.getElementById(
        "option1"
    ).classList.remove("selected");

    document.getElementById(
        "option2"
    ).classList.remove("selected");

    document.getElementById(
        "option3"
    ).classList.remove("selected");

    document.getElementById(
        "option" + number
    ).classList.add("selected");

    document.getElementById(
        "nextButton"
    ).disabled = false;

}


/* =========================================================
   NEXT
========================================================= */

async function nextQuestion() {

    clearInterval(timerInterval);

    if (
        selectedAnswer === null
    ) {

        selectedAnswer = 0;

    }

    const q =
        questions[currentQuestion];

    const correctAnswer =
        Number(q.answer);

    const isCorrect =
        Number(selectedAnswer) ===
        correctAnswer;

    if (isCorrect) {

        correctAnswers++;

    }

    userResults.push({

        question:
            q.question || "",

        selectedAnswer:
            Number(selectedAnswer),

        correctAnswer:
            correctAnswer,

        option1:
            q.option1 || "",

        option2:
            q.option2 || "",

        option3:
            q.option3 || "",

        isCorrect:
            isCorrect

    });

    currentQuestion++;

    if (
        currentQuestion >=
        questions.length
    ) {

        await finishQuiz();

        return;
    }

    showQuestion();

}


/* =========================================================
   FINISH QUIZ
========================================================= */

async function finishQuiz() {

    clearInterval(timerInterval);

    const total =
        questions.length;

    const wrongAnswers =
        total - correctAnswers;

    const {
        data: leaderboardData,
        error: leaderboardError
    } = await supabaseClient
        .from("leaderboard")
        .insert({
            name: userName,
            score: correctAnswers,
            total: total
        })
        .select()
        .single();

    if (leaderboardError) {

        console.log(
            leaderboardError
        );

        alert(
            "نمرەکە تۆمار نەکرا، بەڵام تاقیکردنەوەکەت تەواو بوو."
        );

    } else {

        await supabaseClient
            .from("private_results")
            .insert({

                leaderboard_id:
                    leaderboardData.id,

                phone:
                    userPhone

            });

    }

    let reviewHTML = "";

    userResults.forEach(
        function(result, index) {

            let selectedText =
                "وەڵام نەدراوە";

            let correctText =
                "";

            if (
                result.selectedAnswer === 1
            ) {

                selectedText =
                    "1 ـ " +
                    result.option1;

            }

            if (
                result.selectedAnswer === 2
            ) {

                selectedText =
                    "2 ـ " +
                    result.option2;

            }

            if (
                result.selectedAnswer === 3
            ) {

                selectedText =
                    "3 ـ " +
                    result.option3;

            }

            if (
                result.correctAnswer === 1
            ) {

                correctText =
                    "1 ـ " +
                    result.option1;

            }

            if (
                result.correctAnswer === 2
            ) {

                correctText =
                    "2 ـ " +
                    result.option2;

            }

            if (
                result.correctAnswer === 3
            ) {

                correctText =
                    "3 ـ " +
                    result.option3;

            }

            if (
                result.isCorrect
            ) {

                reviewHTML += `

                    <div class="review-item review-correct">

                        <div class="review-question">

                            ${index + 1}.
                            ${escapeHTML(result.question)}

                        </div>

                        <div class="correct-text">

                            ✅ وەڵامت ڕاستە

                        </div>

                        <div>

                            وەڵامی تۆ:
                            ${escapeHTML(selectedText)}

                        </div>

                    </div>

                `;

            } else {

                reviewHTML += `

                    <div class="review-item review-wrong">

                        <div class="review-question">

                            ${index + 1}.
                            ${escapeHTML(result.question)}

                        </div>

                        <div class="wrong-text">

                            ❌ وەڵامت هەڵەیە

                        </div>

                        <div>

                            وەڵامی تۆ:
                            ${escapeHTML(selectedText)}

                        </div>

                        <div class="correct-answer">

                            ✅ وەڵامی ڕاست:
                            ${escapeHTML(correctText)}

                        </div>

                    </div>

                `;

            }

        }
    );

    document.getElementById(
        "quiz"
    ).innerHTML = `

        <div class="result">

            <h1 class="result-title">
                🎉 تاقیکردنەوەکە تەواو بوو
            </h1>

            <h2>
                بەخێربێیت
                ${escapeHTML(userName)}
                🌹
            </h2>

            <div class="score">
                نمرە:
                ${correctAnswers}
                /
                ${total}
            </div>

            <p>
                کۆی پرسیارەکان:
                <strong>${total}</strong>
            </p>

            <p>
                وەڵامی ڕاست:
                <strong style="color:#00e676;">
                    ${correctAnswers}
                </strong>
            </p>

            <p>
                وەڵامی هەڵە:
                <strong style="color:#ff5252;">
                    ${wrongAnswers}
                </strong>
            </p>

            <div class="review">

                <h2>
                    📋 وردەکاری وەڵامەکان
                </h2>

                ${reviewHTML}

            </div>

            <button
                class="main-button"
                onclick="showLeaderboard()"
            >
                🏆 سەیرکردنی Leaderboard
            </button>

            <button
                class="main-button"
                onclick="location.reload()"
            >
                🔄 دووبارە دەستپێکردنەوە
            </button>

        </div>

    `;

}


/* =========================================================
   LEADERBOARD
========================================================= */

async function showLeaderboard() {

    clearInterval(timerInterval);

    document.getElementById(
        "quiz"
    ).style.display = "none";

    document.getElementById(
        "hostBox"
    ).style.display = "none";

    document.getElementById(
        "leaderboard"
    ).style.display = "block";

    const list =
        document.getElementById(
            "leaderboardList"
        );

    list.innerHTML =
        "<p style='text-align:center;'>چاوەڕێ بە...</p>";

    const {
        data,
        error
    } = await supabaseClient
        .from("leaderboard")
        .select(
            "name, score, total, created_at"
        )
        .order(
            "score",
            { ascending: false }
        )
        .order(
            "created_at",
            { ascending: true }
        );

    if (error) {

        console.log(error);

        list.innerHTML =
            "<p>کێشەیەک ڕوویدا لە Leaderboard.</p>";

        return;
    }

    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            "<p style='text-align:center;'>هێشتا هیچ ئەنجامێک نییە.</p>";

        return;
    }

    let html = "";

    data.forEach(
        function(item, index) {

            html += `

                <div
                    class="leaderboard-row"
                    style="animation-delay:${index * 0.05}s"
                >

                    <div class="rank">
                        #${index + 1}
                    </div>

                    <div style="flex:1;">

                        👤
                        ${escapeHTML(item.name)}

                    </div>

                    <div>

                        🏆
                        ${item.score}/${item.total}

                    </div>

                </div>

            `;

        }
    );

    list.innerHTML = html;

}


function backToQuiz() {

    document.getElementById(
        "leaderboard"
    ).style.display = "none";

    document.getElementById(
        "quiz"
    ).style.display = "block";

}


/* =========================================================
   HOST
========================================================= */

function showHost() {

    clearInterval(timerInterval);

    document.getElementById(
        "quiz"
    ).style.display = "none";

    document.getElementById(
        "leaderboard"
    ).style.display = "none";

    document.getElementById(
        "hostBox"
    ).style.display = "block";

}


function hideHost() {

    document.getElementById(
        "hostBox"
    ).style.display = "none";

}


async function hostLogin() {

    const email =
        document.getElementById(
            "hostEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "hostPassword"
        ).value;

    if (
        email === "" ||
        password === ""
    ) {

        alert(
            "تکایە Email و Password بنووسە."
        );

        return;
    }

    const {
        data,
        error
    } = await supabaseClient.auth
        .signInWithPassword({

            email: email,
            password: password

        });

    if (error) {

        alert(
            "چوونەژوورەوە سەرکەوتوو نەبوو."
        );

        console.log(error);

        return;
    }

    const user =
        data.user;

    const {
        data: hostData,
        error: hostError
    } = await supabaseClient
        .from("hosts")
        .select("user_id")
        .eq(
            "user_id",
            user.id
        )
        .maybeSingle();

    if (
        hostError ||
        !hostData
    ) {

        await supabaseClient.auth.signOut();

        alert(
            "ئەم ئەکاونتە Host نییە."
        );

        return;
    }

    document.getElementById(
        "hostLoginBox"
    ).style.display = "none";

    document.getElementById(
        "hostResults"
    ).style.display = "block";

    await loadHostResults();

}


async function loadHostResults() {

    const list =
        document.getElementById(
            "hostList"
        );

    list.innerHTML =
        "<p>چاوەڕێ بە...</p>";

    const {
        data,
        error
    } = await supabaseClient
        .from("private_results")
        .select(`
            phone,
            created_at,
            leaderboard (
                name,
                score,
                total
            )
        `)
        .order(
            "created_at",
            { ascending: false }
        );

    if (error) {

        console.log(error);

        list.innerHTML =
            "<p>کێشەیەک ڕوویدا.</p>";

        return;
    }

    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            "<p>هێشتا هیچ ئەنجامێک نییە.</p>";

        return;
    }

    let html = "";

    data.forEach(
        function(item, index) {

            const result =
                item.leaderboard;

            html += `

                <div class="host-row">

                    <strong>
                        #${index + 1}
                    </strong>

                    <br><br>

                    👤 ناو:
                    ${escapeHTML(result.name)}

                    <br>

                    📱 مۆبایل:
                    ${escapeHTML(item.phone)}

                    <br>

                    🏆 نمرە:
                    ${result.score}/${result.total}

                </div>

            `;

        }
    );

    list.innerHTML = html;

}


async function hostLogout() {

    await supabaseClient.auth.signOut();

    document.getElementById(
        "hostResults"
    ).style.display = "none";

    document.getElementById(
        "hostLoginBox"
    ).style.display = "block";

    document.getElementById(
        "hostEmail"
    ).value = "";

    document.getElementById(
        "hostPassword"
    ).value = "";

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>
